{{- range $key, $pooler := .Values.poolers }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ include "postgresql.poolerName" (dict "root" $ "key" $key) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "postgresql.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ include "postgresql.databaseWave" $ | quote }}
    {{- include "postgresql.extraAnnotations" $ | nindent 4 }}
spec:
  cluster:
    {{- if hasKey $pooler "cluster" }}{{- fail "Pooler cluster is assigned by this chart" }}{{- end }}
    name: {{ include "postgresql.fullname" $ }}
  pgbouncer:
    {{- $pgbouncer := $pooler.pgbouncer | default dict }}
    {{- if and (eq $.Values.tls.mode "certManager") (not $pgbouncer.authQuerySecret) }}
    {{- /* CNPG's automatic integration signs a client certificate with the client CA key, which cert-manager Secrets do not contain. */}}
    authQuerySecret:
      name: {{ include "postgresql.poolerAuthSecretName" $ }}
    authQuery: {{ $pgbouncer.authQuery | default "SELECT usename, passwd FROM public.user_search($1)" | quote }}
    {{- with omit $pgbouncer "authQuerySecret" "authQuery" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- else }}
    {{- toYaml $pgbouncer | nindent 4 }}
    {{- end }}
  template:
    {{- $template := $pooler.template | default dict }}
    {{- $templateMetadata := $template.metadata | default dict }}
    metadata:
      annotations:
        {{- mustMergeOverwrite (deepCopy $.Values.inheritedAnnotations) ($templateMetadata.annotations | default dict) | toYaml | nindent 8 }}
      {{- with omit $templateMetadata "annotations" }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- with omit $template "metadata" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with omit $pooler "pgbouncer" "template" }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
