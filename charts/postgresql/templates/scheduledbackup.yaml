{{- if .Values.backup.scheduled.enabled }}
{{- $method := .Values.backup.scheduled.method | default (ternary "plugin" "barmanObjectStore" (eq .Values.backup.provider "plugin")) }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "postgresql.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  annotations:
    {{- /* A later wave lets Argo CD wait for the Cluster rollout, so an immediate backup finds the plugin sidecar. */}}
    {{- mustMergeOverwrite (include "postgresql.annotations" . | fromYaml) (dict "argocd.argoproj.io/sync-wave" (include "postgresql.databaseWave" .)) | toYaml | nindent 4 }}
spec:
  cluster:
    name: {{ include "postgresql.fullname" . }}
  schedule: {{ .Values.backup.scheduled.schedule | quote }}
  immediate: {{ .Values.backup.scheduled.immediate }}
  suspend: {{ .Values.backup.scheduled.suspend }}
  backupOwnerReference: {{ .Values.backup.scheduled.backupOwnerReference }}
  method: {{ $method }}
  {{- if eq $method "plugin" }}
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  {{- end }}
{{- end }}
