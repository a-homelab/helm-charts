{{- if eq .Values.credentials.mode "copy" -}}
{{- $name := include "postgresql.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ $name }}-recovery-reader"
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    {{- include "postgresql.annotations" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ $name }}-recovery-reader"
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    {{- include "postgresql.annotations" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - {{ .Values.credentials.copy.userSecretName | quote }}
      {{- if .Values.enableSuperuserAccess }}
      - {{ .Values.credentials.copy.superuserSecretName | quote }}
      {{- end }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ $name }}-recovery-reader"
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    {{- include "postgresql.annotations" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: "{{ $name }}-recovery-reader"
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ $name }}-recovery-reader"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: "{{ $name }}-recovery"
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    {{- include "postgresql.annotations" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace | quote }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: "{{ $name }}-recovery-reader"
{{- end }}
