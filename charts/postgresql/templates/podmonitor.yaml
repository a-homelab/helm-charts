{{- if .Values.monitoring.podMonitor.enabled }}
{{- $name := include "postgresql.fullname" . }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: "{{ $name }}-metrics"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- mustMergeOverwrite (include "postgresql.labels" . | fromYaml) (deepCopy .Values.monitoring.podMonitor.labels) | toYaml | nindent 4 }}
  annotations:
    {{- mustMergeOverwrite (include "postgresql.annotations" . | fromYaml) (deepCopy .Values.monitoring.podMonitor.annotations) | toYaml | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ $name | quote }}
      # Pooler pods share cnpg.io/cluster and also expose a metrics port.
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    {{- if dig "tls" "enabled" false .Values.monitoring.configuration }}
    {{- range .Values.monitoring.podMonitor.podMetricsEndpoints }}
    {{- $tlsConfig := .tlsConfig | default dict }}
    - scheme: {{ .scheme | default "https" }}
      tlsConfig:
        {{- if not $tlsConfig.ca }}
        ca:
          secret:
            {{- if eq $.Values.tls.mode "certManager" }}
            name: "{{ $name }}-server-tls"
            {{- else if eq $.Values.tls.mode "external" }}
            name: {{ dig "serverCASecret" (printf "%s-ca" $name) $.Values.tls.certificates | quote }}
            {{- else }}
            name: "{{ $name }}-ca"
            {{- end }}
            key: ca.crt
        {{- end }}
        {{- if not $tlsConfig.serverName }}
        serverName: "{{ $name }}-rw"
        {{- end }}
        {{- with $tlsConfig }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with omit . "scheme" "tlsConfig" }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- else }}
    {{- toYaml .Values.monitoring.podMonitor.podMetricsEndpoints | nindent 4 }}
    {{- end }}
{{- end }}
{{- if and .Values.monitoring.podMonitor.enabled .Values.poolers }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: "{{ include "postgresql.fullname" . }}-pooler-metrics"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- mustMergeOverwrite (include "postgresql.labels" . | fromYaml) (deepCopy .Values.monitoring.podMonitor.labels) | toYaml | nindent 4 }}
  annotations:
    {{- mustMergeOverwrite (include "postgresql.annotations" . | fromYaml) (deepCopy .Values.monitoring.podMonitor.annotations) | toYaml | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "postgresql.fullname" . | quote }}
      cnpg.io/podRole: pooler
  podMetricsEndpoints:
    - port: metrics
{{- end }}
