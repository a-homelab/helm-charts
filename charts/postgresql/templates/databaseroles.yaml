{{- include "postgresql.validateDatabaseRoles" . -}}
{{- range $role := .Values.databaseRoles }}
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: {{ include "postgresql.sqlResourceName" (dict "root" $ "prefix" "role" "sqlName" $role.name) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "postgresql.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ include "postgresql.databaseWave" $ | quote }}
    {{- include "postgresql.extraAnnotations" $ | nindent 4 }}
spec:
  cluster:
    name: {{ include "postgresql.fullname" $ }}
  databaseRoleReclaimPolicy: {{ $role.databaseRoleReclaimPolicy | default "retain" }}
  {{- include "postgresql.pruneEmpty" (omit $role "databaseRoleReclaimPolicy") | nindent 2 }}
{{- end }}
