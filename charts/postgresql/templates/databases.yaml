{{- include "postgresql.validateDatabases" . }}
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ include "postgresql.sqlResourceName" (dict "root" . "prefix" "db" "sqlName" (include "postgresql.databaseName" .)) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.database.syncWave | toString | default (include "postgresql.databaseWave" .) | quote }}
    {{- include "postgresql.extraAnnotations" . | nindent 4 }}
spec:
  cluster:
    name: {{ include "postgresql.fullname" . }}
  name: {{ include "postgresql.databaseName" . | quote }}
  owner: {{ include "postgresql.databaseOwner" . | quote }}
  ensure: {{ .Values.database.ensure | default "present" }}
  databaseReclaimPolicy: {{ .Values.database.databaseReclaimPolicy | default "retain" }}
  {{- include "postgresql.pruneEmpty" (omit .Values.database "name" "owner" "ensure" "databaseReclaimPolicy" "syncWave" "authMethod") | nindent 2 }}
{{- range $database := .Values.databases }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ include "postgresql.sqlResourceName" (dict "root" $ "prefix" "db" "sqlName" $database.name) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "postgresql.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ include "postgresql.databaseWave" $ | quote }}
    {{- include "postgresql.extraAnnotations" $ | nindent 4 }}
spec:
  cluster:
    name: {{ include "postgresql.fullname" $ }}
  ensure: {{ $database.ensure | default "present" }}
  databaseReclaimPolicy: {{ $database.databaseReclaimPolicy | default "retain" }}
  {{- include "postgresql.pruneEmpty" (omit $database "ensure" "databaseReclaimPolicy") | nindent 2 }}
{{- end }}
