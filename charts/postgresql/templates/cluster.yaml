{{- include "postgresql.validate" . -}}
{{- $name := include "postgresql.fullname" . -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    {{- include "postgresql.annotations" . | nindent 4 }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  inheritedMetadata:
    labels:
      {{- mustMergeOverwrite (include "postgresql.podLabels" . | fromYaml) (deepCopy .Values.inheritedLabels) | toYaml | nindent 6 }}
    annotations:
      {{- toYaml .Values.inheritedAnnotations | nindent 6 }}
  {{- if .Values.imageCatalogRef }}
  imageCatalogRef:
    {{- toYaml .Values.imageCatalogRef | nindent 4 }}
  {{- else if .Values.image.digest }}
  imageName: "{{ .Values.image.repository }}:{{ required "image.tag is required with image.digest so CNPG can infer the PostgreSQL major" .Values.image.tag }}@{{ .Values.image.digest }}"
  {{- else }}
  imageName: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  {{- end }}
  imagePullPolicy: {{ .Values.image.pullPolicy }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if eq (kindOf .Values.instances) "invalid" }}
  instances: {{ .Values.replicaCount }}
  {{- else }}
  instances: {{ .Values.instances }}
  {{- end }}
  enableSuperuserAccess: {{ .Values.enableSuperuserAccess }}
  {{- $postgresql := .Values.postgresqlConfig }}
  {{- if ne (kindOf .Values.postgresql) "invalid" }}
  {{- $postgresql = .Values.postgresql }}
  {{- end }}
  {{- with $postgresql }}
  postgresql:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $managed := deepCopy .Values.managed }}
  {{- $crRoles := dict }}
  {{- range .Values.databaseRoles }}{{- $_ := set $crRoles .name true }}{{- end }}
  {{- if hasKey $managed "roles" }}
  {{- $roles := list }}
  {{- range $managed.roles }}
  {{- if not (hasKey $crRoles .name) }}{{- $roles = append $roles . }}{{- end }}
  {{- end }}
  {{- $_ := set $managed "roles" $roles }}
  {{- end }}
  {{- with $managed }}
  managed:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  bootstrap:
    {{- if .Values.bootstrap }}
    {{- $bootstrap := deepCopy .Values.bootstrap }}
    {{- if eq .Values.credentials.mode "copy" }}
    {{- $_ := set $bootstrap "recovery" (mustMergeOverwrite $bootstrap.recovery (dict "database" (include "postgresql.databaseName" .) "owner" (include "postgresql.databaseOwner" .) "secret" (dict "name" (include "postgresql.credentialResourceName" (dict "root" . "suffix" "app"))))) }}
    {{- end }}
    {{- toYaml $bootstrap | nindent 4 }}
    {{- else }}
    initdb:
      {{- $initdb := mustMergeOverwrite (deepCopy .Values.initdb) (dict "database" (include "postgresql.databaseName" .) "owner" (include "postgresql.databaseOwner" .)) }}
      {{- range $key := list "localeCType" "localeCollate" }}
      {{- if hasKey $.Values.database $key }}{{- $_ := set $initdb $key (get $.Values.database $key) }}{{- end }}
      {{- end }}
      {{- if eq .Values.credentials.mode "existing" }}
      {{- $_ := set $initdb "secret" (dict "name" (required "credentials.existing.userSecretName or userCredsSecretName is required" (include "postgresql.userSecretName" .))) }}
      {{- else }}
      {{- $_ := set $initdb "secret" (dict "name" (include "postgresql.credentialResourceName" (dict "root" . "suffix" "app"))) }}
      {{- end }}
      {{- range $key := list "postInitSQL" "postInitTemplateSQL" "postInitApplicationSQL" }}
      {{- if not (get $initdb $key) }}{{- $_ := unset $initdb $key }}{{- end }}
      {{- end }}
      {{- toYaml $initdb | nindent 6 }}
    {{- end }}
  {{- with .Values.externalClusters }}
  externalClusters:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if eq .Values.credentials.mode "existing" }}
  {{- with (include "postgresql.superuserSecretName" .) }}
  superuserSecret:
    name: {{ . | quote }}
  {{- end }}
  {{- else if .Values.enableSuperuserAccess }}
  superuserSecret:
    name: {{ include "postgresql.credentialResourceName" (dict "root" . "suffix" "superuser") | quote }}
  {{- end }}
  {{- if eq .Values.tls.mode "certManager" }}
  certificates:
    serverTLSSecret: "{{ $name }}-server-tls"
    serverCASecret: "{{ $name }}-server-tls"
    clientCASecret: "{{ $name }}-client-replica-tls"
    replicationTLSSecret: "{{ $name }}-client-replica-tls"
  {{- else if eq .Values.tls.mode "external" }}
  certificates:
    {{- toYaml .Values.tls.certificates | nindent 4 }}
  {{- end }}
  primaryUpdateStrategy: {{ .Values.primaryUpdateStrategy }}
  primaryUpdateMethod: {{ .Values.primaryUpdateMethod }}
  storage:
    {{- mustMergeOverwrite (dict "storageClass" .Values.storageClass "size" .Values.storageSize) (deepCopy .Values.storage) | toYaml | nindent 4 }}
  {{- with .Values.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if eq (kindOf .Values.topologySpreadConstraints) "invalid" }}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          {{- if eq .Values.scheduling.topologySpreadSelector "legacy" }}
          {{- include "postgresql.podLabels" . | nindent 10 }}
          {{- else }}
          cnpg.io/cluster: {{ $name | quote }}
          {{- end }}
  {{- else if .Values.topologySpreadConstraints }}
  topologySpreadConstraints:
    {{- toYaml .Values.topologySpreadConstraints | nindent 4 }}
  {{- end }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  {{- if eq .Values.backup.provider "plugin" }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "postgresql.objectStoreName" . | quote }}
  {{- end }}
  backup:
    target: {{ .Values.backup.target }}
    {{- if eq .Values.backup.provider "inTree" }}
    barmanObjectStore:
      {{- include "postgresql.backupConfiguration" . | nindent 6 }}
    retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
    {{- end }}
    {{- with .Values.backup.volumeSnapshot }}
    volumeSnapshot:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  replicationSlots:
    highAvailability:
      enabled: true
  monitoring:
    {{- mustMergeOverwrite (deepCopy .Values.monitoring.configuration) (dict "enablePodMonitor" (eq .Values.monitoring.mode "operator")) | toYaml | nindent 4 }}
  {{- with .Values.clusterSpec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
