{{- include "postgresql.validate" . -}}
{{- $name := include "postgresql.fullname" . -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    {{- include "postgresql.annotations" . | nindent 4 }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  inheritedMetadata:
    labels:
      {{- mustMergeOverwrite (include "postgresql.podLabels" . | fromYaml) (deepCopy .Values.inheritedLabels) | toYaml | nindent 6 }}
    annotations:
      {{- toYaml .Values.inheritedAnnotations | nindent 6 }}
  {{- if .Values.imageCatalogRef }}
  imageCatalogRef:
    {{- toYaml .Values.imageCatalogRef | nindent 4 }}
  {{- else if .Values.image.digest }}
  imageName: "{{ .Values.image.repository }}:{{ required "image.tag is required with image.digest so CNPG can infer the PostgreSQL major" .Values.image.tag }}@{{ .Values.image.digest }}"
  {{- else }}
  imageName: "{{ .Values.image.repository }}:{{ required "image.tag or imageCatalogRef is required; pin an explicit PostgreSQL version" .Values.image.tag }}"
  {{- end }}
  imagePullPolicy: {{ .Values.image.pullPolicy }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  instances: {{ .Values.instances }}
  enableSuperuserAccess: {{ .Values.enableSuperuserAccess }}
  {{- $certificateLogin := eq .Values.database.authMethod "certificate" }}
  {{- if or $certificateLogin .Values.postgresql }}
  postgresql:
    {{- if or $certificateLogin .Values.postgresql.pg_hba }}
    pg_hba:
      {{- if $certificateLogin }}
      {{- $owner := include "postgresql.databaseOwner" . }}
      {{- /* cert is TLS-only, so a non-TLS login would reach CNPG's catch-all scram rule; reject it. */}}
      - "hostssl all {{ $owner }} all cert"
      - "hostnossl all {{ $owner }} all reject"
      {{- end }}
      {{- with .Values.postgresql.pg_hba }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- with omit .Values.postgresql "pg_hba" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- with .Values.managed }}
  managed:
    {{- with omit . "roles" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if hasKey . "roles" }}
    {{- $crRoles := list }}
    {{- range $.Values.databaseRoles }}{{- $crRoles = append $crRoles .name }}{{- end }}
    {{- $roles := list }}
    {{- range .roles }}
    {{- if not (has .name $crRoles) }}{{- $roles = append $roles . }}{{- end }}
    {{- end }}
    roles:
      {{- toYaml $roles | nindent 6 }}
    {{- end }}
  {{- end }}
  bootstrap:
    {{- if and .Values.bootstrap (eq .Values.credentials.mode "copy") }}
    {{- with omit .Values.bootstrap "recovery" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    recovery:
      database: {{ include "postgresql.databaseName" . | quote }}
      owner: {{ include "postgresql.databaseOwner" . | quote }}
      secret:
        name: {{ include "postgresql.ownerSecretName" . | quote }}
      {{- with omit .Values.bootstrap.recovery "database" "owner" "secret" }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- else if .Values.bootstrap }}
    {{- toYaml .Values.bootstrap | nindent 4 }}
    {{- else }}
    initdb:
      database: {{ include "postgresql.databaseName" . | quote }}
      owner: {{ include "postgresql.databaseOwner" . | quote }}
      localeCType: {{ .Values.database.localeCType | quote }}
      localeCollate: {{ .Values.database.localeCollate | quote }}
      secret:
        name: {{ include "postgresql.ownerSecretName" . | quote }}
      {{- with .Values.initdb.postInitSQL }}
      postInitSQL:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initdb.postInitTemplateSQL }}
      postInitTemplateSQL:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initdb.postInitApplicationSQL }}
      postInitApplicationSQL:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with omit .Values.initdb "database" "owner" "localeCType" "localeCollate" "secret" "postInitSQL" "postInitTemplateSQL" "postInitApplicationSQL" }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
  {{- with .Values.externalClusters }}
  externalClusters:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if or .Values.enableSuperuserAccess (eq .Values.credentials.mode "existing") }}
  {{- with include "postgresql.superuserSecretName" . }}
  superuserSecret:
    name: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.tls.mode "certManager" }}
  certificates:
    serverTLSSecret: "{{ $name }}-server-tls"
    serverCASecret: "{{ $name }}-server-tls"
    clientCASecret: "{{ $name }}-client-replica-tls"
    replicationTLSSecret: "{{ $name }}-client-replica-tls"
  {{- else if eq .Values.tls.mode "external" }}
  certificates:
    {{- toYaml .Values.tls.certificates | nindent 4 }}
  {{- else if or .Values.poolers .Values.tls.serverAltDNSNames }}
  certificates:
    serverAltDNSNames:
      {{- include "postgresql.poolerDNSNames" . | nindent 6 }}
      {{- with .Values.tls.serverAltDNSNames }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  {{- end }}
  primaryUpdateStrategy: {{ .Values.primaryUpdateStrategy }}
  primaryUpdateMethod: {{ .Values.primaryUpdateMethod }}
  smartShutdownTimeout: {{ .Values.smartShutdownTimeout }}
  storage:
    {{- toYaml .Values.storage | nindent 4 }}
  {{- $nodeAffinity := .Values.affinity.nodeAffinity | default dict }}
  {{- if or .Values.storageNodesOnly .Values.affinity }}
  affinity:
    {{- if or .Values.storageNodesOnly $nodeAffinity }}
    nodeAffinity:
      {{- if and .Values.storageNodesOnly (not $nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution) }}
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.benfu.me/storage
                operator: In
                values:
                  - "true"
      {{- end }}
      {{- with $nodeAffinity }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- with omit .Values.affinity "nodeAffinity" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.spreadAcrossNodes .Values.topologySpreadConstraints }}
  topologySpreadConstraints:
    {{- if .Values.spreadAcrossNodes }}
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: {{ $name }}
    {{- end }}
    {{- with .Values.topologySpreadConstraints }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  {{- if .Values.backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ default $name .Values.backup.objectStore.existingName | quote }}
        {{- with .Values.backup.serverName }}
        serverName: {{ . | quote }}
        {{- end }}
  {{- end }}
  backup:
    target: {{ .Values.backup.target }}
    {{- with .Values.backup.volumeSnapshot }}
    volumeSnapshot:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- $highAvailability := .Values.replicationSlots.highAvailability | default dict }}
  replicationSlots:
    highAvailability:
      enabled: {{ dig "enabled" true $highAvailability }}
      {{- with omit $highAvailability "enabled" }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- with omit .Values.replicationSlots "highAvailability" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  monitoring:
    {{- /* Explicit false, CNPG's default: the chart owns any PodMonitor. */}}
    enablePodMonitor: false
    {{- with .Values.monitoring.configuration }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.extraClusterSpec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
