{{- if ne .Values.credentials.mode "existing" -}}
{{- $root := . -}}
{{- $name := include "postgresql.fullname" . -}}
{{- $roles := list (dict "suffix" "app" "username" (include "postgresql.databaseOwner" .) "database" (include "postgresql.databaseName" .) "source" .Values.credentials.copy.userSecretName) -}}
{{- if .Values.enableSuperuserAccess -}}
{{- $roles = append $roles (dict "suffix" "superuser" "username" "postgres" "database" "postgres" "source" .Values.credentials.copy.superuserSecretName) -}}
{{- end -}}
{{- range $role := $roles }}
{{- $resourceName := include "postgresql.credentialResourceName" (dict "root" $root "suffix" $role.suffix) }}
{{- if eq $root.Values.credentials.mode "generated" }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $resourceName }}
  namespace: {{ $root.Release.Namespace | quote }}
  annotations:
    {{- include "postgresql.annotations" $root | nindent 4 }}
spec:
  {{- toYaml $root.Values.credentials.password | nindent 2 }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $resourceName }}
  namespace: {{ $root.Release.Namespace | quote }}
  annotations:
    {{- include "postgresql.annotations" $root | nindent 4 }}
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ ternary $root.Values.credentials.rotation.interval "0s" $root.Values.credentials.rotation.enabled | quote }}
  target:
    name: {{ $resourceName }}
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        {{- include "postgresql.connectionData" (dict "root" $root "role" $role) | nindent 8 }}
  {{- if eq $root.Values.credentials.mode "generated" }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $resourceName }}
  {{- else }}
  secretStoreRef:
    name: "{{ $name }}-recovery"
    kind: SecretStore
  data:
    - secretKey: username
      remoteRef:
        key: {{ $role.source | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $role.source | quote }}
        property: password
  {{- end }}
{{- end }}
{{- end }}
