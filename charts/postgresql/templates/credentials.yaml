{{- if ne .Values.credentials.mode "existing" }}
{{- range $role := include "postgresql.credentialRoles" . | fromYamlArray }}
{{- if eq $.Values.credentials.mode "generated" }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $role.secretName }}
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    {{- include "postgresql.annotations" $ | nindent 4 }}
spec:
  {{- toYaml $.Values.credentials.password | nindent 2 }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $role.secretName }}
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    {{- include "postgresql.annotations" $ | nindent 4 }}
spec:
  {{- if $.Values.credentials.rotation.enabled }}
  refreshPolicy: Periodic
  refreshInterval: {{ $.Values.credentials.rotation.interval | quote }}
  {{- else }}
  # CreatedOnce never refreshes, even on a force-sync annotation. The explicit
  # 0s keeps the CRD default of 1h from suggesting a schedule.
  refreshPolicy: CreatedOnce
  refreshInterval: "0s"
  {{- end }}
  target:
    name: {{ $role.secretName }}
    creationPolicy: Orphan
    deletionPolicy: Retain
    # Immutability keeps a recreated ExternalSecret from overwriting the
    # existing password; rotation needs a mutable Secret.
    immutable: {{ not $.Values.credentials.rotation.enabled }}
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        {{- /* The password expressions are External Secrets templates, evaluated by ESO rather than Helm. */}}
        {{- $name := include "postgresql.fullname" $ }}
        {{- $host := printf "%s-rw.%s" $name $.Release.Namespace }}
        {{- $fqdn := printf "%s.svc.%s" $host $.Values.clusterDomain }}
        {{- $user := $role.username | urlquery | replace "+" "%20" }}
        {{- $db := $role.database | urlquery | replace "+" "%20" }}
        {{- $passwordURI := `{{ .password | urlquery | replace "+" "%20" }}` }}
        {{- $passwordQuery := `{{ .password | urlquery }}` }}
        {{- $pgUser := $role.username | replace "\\" "\\\\" | replace ":" "\\:" }}
        {{- $pgDB := $role.pgpassDatabase | replace "\\" "\\\\" | replace ":" "\\:" }}
        {{- $pgPassword := `{{ .password | replace "\\" "\\\\" | replace ":" "\\:" }}` }}
        username: {{ $role.username | quote }}
        {{- if eq $.Values.credentials.mode "copy" }}
        password: {{ printf `{{ if ne .username %q }}{{ fail "source credential username does not match the restored role" }}{{ end }}{{ .password }}` $role.username | quote }}
        {{- else }}
        password: '{{ "{{ .password }}" }}'
        {{- end }}
        host: {{ printf "%s-rw" $name | quote }}
        port: "5432"
        dbname: {{ $role.database | quote }}
        user: {{ $role.username | quote }}
        pgpass: {{ printf "%s-rw:5432:%s:%s:%s\n" $name $pgDB $pgUser $pgPassword | quote }}
        uri: {{ printf "postgresql://%s:%s@%s:5432/%s" $user $passwordURI $host $db | quote }}
        jdbc-uri: {{ printf "jdbc:postgresql://%s:5432/%s?password=%s&user=%s" $host $db $passwordQuery ($role.username | urlquery) | quote }}
        fqdn-uri: {{ printf "postgresql://%s:%s@%s:5432/%s" $user $passwordURI $fqdn $db | quote }}
        fqdn-jdbc-uri: {{ printf "jdbc:postgresql://%s:5432/%s?password=%s&user=%s" $fqdn $db $passwordQuery ($role.username | urlquery) | quote }}
  {{- if eq $.Values.credentials.mode "generated" }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $role.secretName }}
  {{- else }}
  secretStoreRef:
    name: "{{ include "postgresql.fullname" $ }}-recovery"
    kind: SecretStore
  data:
    - secretKey: username
      remoteRef:
        key: {{ $role.source | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $role.source | quote }}
        property: password
  {{- end }}
{{- end }}
{{- end }}
