suite: TLS
release:
  name: test
  namespace: test
tests:
  - it: adds extra server DNS names to the cert-manager server Certificate
    values:
      - ../examples/existing.yaml
    set:
      tls.serverAltDNSNames:
        - example-postgres-pooler-rw
        - db.example.internal
    asserts:
      # The full list is pinned; the Python test checked the last two entries.
      - equal:
          path: spec.dnsNames
          value:
            - example-postgres-rw
            - example-postgres-rw.test
            - example-postgres-rw.test.svc
            - example-postgres-r
            - example-postgres-r.test
            - example-postgres-r.test.svc
            - example-postgres-ro
            - example-postgres-ro.test
            - example-postgres-ro.test.svc
            - example-postgres-rw.test.svc.cluster.local
            - example-postgres-r.test.svc.cluster.local
            - example-postgres-ro.test.svc.cluster.local
            - example-postgres-pooler-rw
            - db.example.internal
        documentSelector:
          path: metadata.name
          value: example-postgres-server-tls

  - it: passes extra server DNS names to CNPG in operator mode
    values:
      - ../examples/existing.yaml
    set:
      tls.mode: operator
      tls.serverAltDNSNames:
        - example-postgres-pooler-rw
        - db.example.internal
    asserts:
      - equal:
          path: spec.certificates
          value:
            serverAltDNSNames:
              - example-postgres-pooler-rw
              - db.example.internal
        documentSelector:
          path: kind
          value: Cluster

  - it: issues every Certificate from the cnpg-ca ClusterIssuer with clientCA issuer
    values:
      - ../examples/snapshot.yaml
    set:
      tls.clientCA: issuer
    asserts:
      - equal:
          path: spec.issuerRef
          value:
            name: cnpg-ca
            kind: ClusterIssuer
        documentSelector:
          path: kind
          value: Certificate
          matchMany: true
      # Stronger than the Python check that some SAN ends in .svc.cluster.local.
      - contains:
          path: spec.dnsNames
          content: test-postgresql-rw.test.svc.cluster.local
        documentSelector:
          path: metadata.name
          value: test-postgresql-server-tls

  - it: renders no cert-manager resources in operator mode
    values:
      - ../examples/existing.yaml
    set:
      tls.mode: operator
      tls.certificates: {}
    asserts:
      - isKind:
          of: Certificate
        not: true
      - notExists:
          path: spec.certificates
        documentSelector:
          path: kind
          value: Cluster

  - it: renders no cert-manager resources in external mode
    values:
      - ../examples/existing.yaml
    set:
      tls.mode: external
      tls.certificates:
        serverTLSSecret: server
        serverCASecret: ca
    asserts:
      - isKind:
          of: Certificate
        not: true
      - equal:
          path: spec.certificates
          value:
            serverTLSSecret: server
            serverCASecret: ca
        documentSelector:
          path: kind
          value: Cluster

  - it: issues a superuser client Certificate from cnpg-ca without enabling superuser access
    values:
      - ../examples/existing.yaml
    set:
      tls.superuserCertificate: true
      tls.clientCA: issuer
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^example-postgres-(client-replica|client-superuser|client-user|server)-tls$
        documentSelector:
          path: kind
          value: Certificate
          matchMany: true
      - isKind:
          of: Certificate
        documentSelector:
          path: metadata.name
          value: example-postgres-client-replica-tls
      - isKind:
          of: Certificate
        documentSelector:
          path: metadata.name
          value: example-postgres-client-superuser-tls
      - isKind:
          of: Certificate
        documentSelector:
          path: metadata.name
          value: example-postgres-client-user-tls
      - isKind:
          of: Certificate
        documentSelector:
          path: metadata.name
          value: example-postgres-server-tls
      - equal:
          path: spec.issuerRef.name
          value: cnpg-ca
        documentSelector:
          path: kind
          value: Certificate
          matchMany: true
      - equal:
          path: spec.commonName
          value: postgres
        documentSelector:
          path: metadata.name
          value: example-postgres-client-superuser-tls
      - contains:
          path: spec.usages
          content: client auth
        documentSelector:
          path: metadata.name
          value: example-postgres-client-superuser-tls
      - equal:
          path: spec.enableSuperuserAccess
          value: false
        documentSelector:
          path: kind
          value: Cluster
      - notExists:
          path: spec.postgresql
        documentSelector:
          path: kind
          value: Cluster

  - it: issues every Certificate from an overridden issuer with clientCA issuer
    values:
      - ../examples/existing.yaml
    set:
      tls.issuerRef.name: custom
      tls.issuerRef.kind: Issuer
      tls.clientCA: issuer
    asserts:
      - equal:
          path: spec.issuerRef
          value:
            name: custom
            kind: Issuer
        documentSelector:
          path: kind
          value: Certificate
          matchMany: true

  - it: issues client Certificates from the cluster's own CA and the server Certificate from cnpg-ca
    values:
      - ../examples/existing.yaml
    set:
      tls.superuserCertificate: true
    asserts:
      - equal:
          path: spec.issuerRef
          value:
            name: example-postgres-client-ca
            kind: Issuer
            group: cert-manager.io
        documentSelector:
          path: metadata.name
          value: example-postgres-client-replica-tls
      - equal:
          path: spec.issuerRef.name
          value: example-postgres-client-ca
        documentSelector:
          path: metadata.name
          value: example-postgres-client-user-tls
      - equal:
          path: spec.issuerRef.name
          value: example-postgres-client-ca
        documentSelector:
          path: metadata.name
          value: example-postgres-client-superuser-tls
      - equal:
          path: spec.issuerRef
          value:
            name: cnpg-ca
            kind: ClusterIssuer
        documentSelector:
          path: metadata.name
          value: example-postgres-server-tls

  - it: makes the client CA a self-signed root whose key renewals keep
    values:
      - ../examples/existing.yaml
    template: templates/certificate-client-ca.yaml
    asserts:
      - equal:
          path: spec.isCA
          value: true
      - equal:
          path: spec.commonName
          value: Ben Fu Homelab PostgreSQL Client CA test/example-postgres
      - equal:
          path: spec.privateKey.rotationPolicy
          value: Never
      - equal:
          path: spec.secretName
          value: example-postgres-client-ca
      - equal:
          path: spec.issuerRef
          value:
            name: example-postgres-client-ca-selfsigned
            kind: Issuer
            group: cert-manager.io

  - it: keeps the CA key out of every Secret the Cluster names
    values:
      - ../examples/existing.yaml
    template: templates/cluster.yaml
    asserts:
      - equal:
          path: spec.certificates
          value:
            serverTLSSecret: example-postgres-server-tls
            serverCASecret: example-postgres-server-tls
            clientCASecret: example-postgres-client-replica-tls
            replicationTLSSecret: example-postgres-client-replica-tls

  - it: lets the bootstrap Issuer's policy approve only this cluster's CA in its namespace
    values:
      - ../examples/existing.yaml
    template: templates/issuer-client-ca-selfsigned.yaml
    documentSelector:
      path: kind
      value: CertificateRequestPolicy
    asserts:
      - equal:
          path: spec.allowed.commonName
          value:
            value: Ben Fu Homelab PostgreSQL Client CA test/example-postgres
            required: true
      - equal:
          path: spec.allowed.isCA
          value: true
      - equal:
          path: spec.selector
          value:
            issuerRef:
              name: example-postgres-client-ca-selfsigned
              kind: Issuer
              group: cert-manager.io
            namespace:
              matchNames:
                - test

  - it: lets the client CA's policy approve only the identities the chart issues
    values:
      - ../examples/existing.yaml
    set:
      tls.superuserCertificate: true
    template: templates/issuer-client-ca.yaml
    documentSelector:
      path: kind
      value: CertificateRequestPolicy
    asserts:
      - equal:
          path: spec.allowed.commonName.validations[0].rule
          value: self in ["streaming_replica","app","postgres"]
      - equal:
          path: spec.allowed.dnsNames.values
          value:
            - streaming_replica
            - app
            - postgres
      - equal:
          path: spec.allowed.isCA
          value: false
      - equal:
          path: spec.selector.namespace.matchNames
          value:
            - test

  - it: adds the pooler identity to the client CA's policy when a Pooler needs it
    values:
      - ../examples/existing.yaml
    set:
      poolers:
        rw:
          instances: 1
          type: rw
          pgbouncer:
            poolMode: transaction
    template: templates/issuer-client-ca.yaml
    documentSelector:
      path: kind
      value: CertificateRequestPolicy
    asserts:
      - contains:
          path: spec.allowed.dnsNames.values
          content: cnpg_pooler_pgbouncer

  - it: orders the policies before the CA and the CA before the client Certificates
    values:
      - ../examples/existing.yaml
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-7"
        documentSelector:
          path: kind
          value: CertificateRequestPolicy
          matchMany: true
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-7"
        template: templates/issuer-client-ca-selfsigned.yaml
        documentSelector:
          path: kind
          value: Issuer
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-6"
        template: templates/certificate-client-ca.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-6"
        template: templates/issuer-client-ca.yaml
        documentSelector:
          path: kind
          value: Issuer
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-5"
        documentSelector:
          path: metadata.name
          value: example-postgres-client-user-tls

  - it: renders no client CA without certManager
    values:
      - ../examples/existing.yaml
    set:
      tls.mode: operator
    asserts:
      - isKind:
          of: CertificateRequestPolicy
        not: true
      - isKind:
          of: Issuer
        not: true
