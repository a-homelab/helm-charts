suite: credentials
release:
  name: test
  namespace: test
tests:
  - it: makes generated credential Secrets immutable without rotation
    values:
      - ../examples/generated.yaml
    asserts:
      - equal:
          path: spec.target.immutable
          value: true
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true

  - it: makes generated credential Secrets mutable with rotation
    values:
      - ../examples/generated.yaml
    set:
      credentials.rotation.enabled: true
    asserts:
      - equal:
          path: spec.target.immutable
          value: false
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true

  - it: makes copied credential Secrets immutable
    values:
      - ../examples/recovery.yaml
    asserts:
      - equal:
          path: spec.target.immutable
          value: true
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true

  - it: creates named generated Secrets once and never rotates them on a schedule
    values:
      - ../examples/existing.yaml
    set:
      credentials.mode: generated
    asserts:
      - equal:
          path: spec.bootstrap.initdb.secret
          value:
            name: example-postgres-app
        documentSelector:
          path: kind
          value: Cluster
      - notExists:
          path: spec.superuserSecret
        documentSelector:
          path: kind
          value: Cluster
      - equal:
          path: spec.target.name
          value: example-postgres-app
        documentSelector:
          path: kind
          value: ExternalSecret
      - equal:
          path: spec.target.creationPolicy
          value: Orphan
        documentSelector:
          path: kind
          value: ExternalSecret
      - equal:
          path: spec.refreshPolicy
          value: CreatedOnce
        documentSelector:
          path: kind
          value: ExternalSecret
      - equal:
          path: spec.refreshInterval
          value: 0s
        documentSelector:
          path: kind
          value: ExternalSecret
      - equal:
          path: spec.target.immutable
          value: true
        documentSelector:
          path: kind
          value: ExternalSecret
      - equal:
          path: spec.target.template.metadata.labels
          value:
            cnpg.io/reload: "true"
        documentSelector:
          path: kind
          value: ExternalSecret
      # Exact data pins both the key set and username: app.
      - equal:
          path: spec.target.template.data
          value:
            username: app
            password: "{{ .password }}"
            host: example-postgres-rw
            port: "5432"
            dbname: app
            user: app
            pgpass: "example-postgres-rw:5432:app:app:{{ .password | replace \"\\\\\" \"\\\\\\\\\" | replace \":\" \"\\\\:\" }}\n"
            uri: "postgresql://app:{{ .password | urlquery | replace \"+\" \"%20\" }}@example-postgres-rw.test:5432/app"
            jdbc-uri: "jdbc:postgresql://example-postgres-rw.test:5432/app?password={{ .password | urlquery }}&user=app"
            fqdn-uri: "postgresql://app:{{ .password | urlquery | replace \"+\" \"%20\" }}@example-postgres-rw.test.svc.cluster.local:5432/app"
            fqdn-jdbc-uri: "jdbc:postgresql://example-postgres-rw.test.svc.cluster.local:5432/app?password={{ .password | urlquery }}&user=app"
        documentSelector:
          path: kind
          value: ExternalSecret
      - equal:
          path: spec.length
          value: 42
        documentSelector:
          path: kind
          value: Password
      - isKind:
          of: Secret
        not: true
      - isKind:
          of: SecretStore
        not: true
      - isKind:
          of: PushSecret
        not: true

  # Pins the outputs that a random or time-based function would change.
  - it: renders generated credentials deterministically
    values:
      - ../examples/existing.yaml
    set:
      credentials.mode: generated
    asserts:
      - hasDocuments:
          count: 0
        template: certificate-client-pooler.yaml
      - hasDocuments:
          count: 1
        template: certificate-client-replica.yaml
      - hasDocuments:
          count: 0
        template: certificate-client-superuser.yaml
      - hasDocuments:
          count: 1
        template: certificate-client-user.yaml
      - hasDocuments:
          count: 1
        template: certificate-server.yaml
      - hasDocuments:
          count: 1
        template: cluster.yaml
      - hasDocuments:
          count: 2
        template: credentials.yaml
      - hasDocuments:
          count: 0
        template: databaseroles.yaml
      - hasDocuments:
          count: 1
        template: databases.yaml
      - hasDocuments:
          count: 1
        template: obc-backup.yaml
      - hasDocuments:
          count: 1
        template: objectstore.yaml
      - hasDocuments:
          count: 1
        template: podmonitor.yaml
      - hasDocuments:
          count: 0
        template: poolers.yaml
      - hasDocuments:
          count: 0
        template: recovery-secretstore.yaml
      - hasDocuments:
          count: 1
        template: scheduledbackup.yaml
      - isKind:
          of: Password
        template: credentials.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: example-postgres-app
        template: credentials.yaml
        documentIndex: 0
      - equal:
          path: spec
          value:
            length: 42
            digits: 5
            symbols: 5
            symbolCharacters: -_$@
            noUpper: false
            allowRepeat: true
        template: credentials.yaml
        documentIndex: 0
      - isKind:
          of: ExternalSecret
        template: credentials.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: example-postgres-app
        template: credentials.yaml
        documentIndex: 1
      - equal:
          path: spec.target.name
          value: example-postgres-app
        template: credentials.yaml
        documentIndex: 1
      - equal:
          path: spec.refreshPolicy
          value: CreatedOnce
        template: credentials.yaml
        documentIndex: 1
      - equal:
          path: spec.refreshInterval
          value: 0s
        template: credentials.yaml
        documentIndex: 1
      - equal:
          path: spec.target.immutable
          value: true
        template: credentials.yaml
        documentIndex: 1
      - equal:
          path: spec.target.creationPolicy
          value: Orphan
        template: credentials.yaml
        documentIndex: 1
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef.name
          value: example-postgres-app
        template: credentials.yaml
        documentIndex: 1

  - it: targets the cluster-derived app Secret for generated credentials without superuser access
    values:
      - ../examples/existing.yaml
    set:
      enableSuperuserAccess: false
      credentials.mode: generated
      credentials.copy.superuserSecretName: source-admin
    asserts:
      - equal:
          path: spec.bootstrap.initdb.secret
          value:
            name: example-postgres-app
        documentSelector:
          path: kind
          value: Cluster
      - notExists:
          path: spec.superuserSecret
        documentSelector:
          path: kind
          value: Cluster
      - matchRegex:
          path: spec.target.name
          pattern: ^example-postgres-app$
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: metadata.name
          value: example-postgres-app
        documentSelector:
          path: spec.target.name
          value: example-postgres-app
      - equal:
          path: spec.target.creationPolicy
          value: Orphan
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - exists:
          path: spec.target.template.data.password
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: spec.target.template.data.username
          value: app
        documentSelector:
          path: spec.target.name
          value: example-postgres-app

  - it: targets the cluster-derived app Secret for copied credentials without superuser access
    values:
      - ../examples/recovery.yaml
    set:
      enableSuperuserAccess: false
      credentials.mode: copy
      credentials.copy.superuserSecretName: source-admin
    asserts:
      - equal:
          path: spec.bootstrap.recovery.secret
          value:
            name: example-restored-recovery-app
        documentSelector:
          path: kind
          value: Cluster
      - notExists:
          path: spec.superuserSecret
        documentSelector:
          path: kind
          value: Cluster
      - matchRegex:
          path: spec.target.name
          pattern: ^example-restored-recovery-app$
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: metadata.name
          value: example-restored-recovery-app
        documentSelector:
          path: spec.target.name
          value: example-restored-recovery-app
      - equal:
          path: spec.target.creationPolicy
          value: Orphan
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - exists:
          path: spec.target.template.data.password
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: spec.target.template.data.username
          value: app
        documentSelector:
          path: spec.target.name
          value: example-restored-recovery-app

  - it: targets cluster-derived app and superuser Secrets for generated credentials with superuser access
    values:
      - ../examples/existing.yaml
    set:
      enableSuperuserAccess: true
      credentials.mode: generated
      credentials.copy.superuserSecretName: source-admin
    asserts:
      - equal:
          path: spec.bootstrap.initdb.secret
          value:
            name: example-postgres-app
        documentSelector:
          path: kind
          value: Cluster
      - equal:
          path: spec.superuserSecret
          value:
            name: example-postgres-superuser
        documentSelector:
          path: kind
          value: Cluster
      - matchRegex:
          path: spec.target.name
          pattern: ^example-postgres-(app|superuser)$
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: metadata.name
          value: example-postgres-app
        documentSelector:
          path: spec.target.name
          value: example-postgres-app
      - equal:
          path: metadata.name
          value: example-postgres-superuser
        documentSelector:
          path: spec.target.name
          value: example-postgres-superuser
      - equal:
          path: spec.target.creationPolicy
          value: Orphan
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - exists:
          path: spec.target.template.data.password
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: spec.target.template.data.username
          value: app
        documentSelector:
          path: spec.target.name
          value: example-postgres-app
      - equal:
          path: spec.target.template.data.username
          value: postgres
        documentSelector:
          path: spec.target.name
          value: example-postgres-superuser

  - it: targets cluster-derived app and superuser Secrets for copied credentials with superuser access
    values:
      - ../examples/recovery.yaml
    set:
      enableSuperuserAccess: true
      credentials.mode: copy
      credentials.copy.superuserSecretName: source-admin
    asserts:
      - equal:
          path: spec.bootstrap.recovery.secret
          value:
            name: example-restored-recovery-app
        documentSelector:
          path: kind
          value: Cluster
      - equal:
          path: spec.superuserSecret
          value:
            name: example-restored-recovery-superuser
        documentSelector:
          path: kind
          value: Cluster
      - matchRegex:
          path: spec.target.name
          pattern: ^example-restored-recovery-(app|superuser)$
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: metadata.name
          value: example-restored-recovery-app
        documentSelector:
          path: spec.target.name
          value: example-restored-recovery-app
      - equal:
          path: metadata.name
          value: example-restored-recovery-superuser
        documentSelector:
          path: spec.target.name
          value: example-restored-recovery-superuser
      - equal:
          path: spec.target.creationPolicy
          value: Orphan
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - exists:
          path: spec.target.template.data.password
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: spec.target.template.data.username
          value: app
        documentSelector:
          path: spec.target.name
          value: example-restored-recovery-app
      - equal:
          path: spec.target.template.data.username
          value: postgres
        documentSelector:
          path: spec.target.name
          value: example-restored-recovery-superuser

  - it: rejects a native initdb bootstrap without an explicit secret
    values:
      - ../examples/existing.yaml
    set:
      bootstrap.initdb.database: app
      bootstrap.initdb.owner: app
    asserts:
      - failedTemplate:
          errorPattern: CNPG-generated credential Secrets are disabled

  - it: keeps the explicit secret of a native initdb bootstrap
    values:
      - ../examples/existing.yaml
    set:
      bootstrap.initdb.database: app
      bootstrap.initdb.owner: app
      bootstrap.initdb.secret.name: explicit-credentials
    asserts:
      - equal:
          path: spec.bootstrap.initdb.secret
          value:
            name: explicit-credentials
        documentSelector:
          path: kind
          value: Cluster

  - it: rejects a native recovery bootstrap without an explicit secret
    values:
      - ../examples/existing.yaml
    set:
      bootstrap.recovery.database: app
      bootstrap.recovery.owner: app
      bootstrap.recovery.source: source
    asserts:
      - failedTemplate:
          errorPattern: CNPG-generated credential Secrets are disabled

  - it: keeps the explicit secret of a native recovery bootstrap
    values:
      - ../examples/existing.yaml
    set:
      bootstrap.recovery.database: app
      bootstrap.recovery.owner: app
      bootstrap.recovery.source: source
      bootstrap.recovery.secret.name: explicit-credentials
    asserts:
      - equal:
          path: spec.bootstrap.recovery.secret
          value:
            name: explicit-credentials
        documentSelector:
          path: kind
          value: Cluster

  - it: rejects a native pg_basebackup bootstrap without an explicit secret
    values:
      - ../examples/existing.yaml
    set:
      bootstrap.pg_basebackup.database: app
      bootstrap.pg_basebackup.owner: app
      bootstrap.pg_basebackup.source: source
    asserts:
      - failedTemplate:
          errorPattern: CNPG-generated credential Secrets are disabled

  - it: keeps the explicit secret of a native pg_basebackup bootstrap
    values:
      - ../examples/existing.yaml
    set:
      bootstrap.pg_basebackup.database: app
      bootstrap.pg_basebackup.owner: app
      bootstrap.pg_basebackup.source: source
      bootstrap.pg_basebackup.secret.name: explicit-credentials
    asserts:
      - equal:
          path: spec.bootstrap.pg_basebackup.secret
          value:
            name: explicit-credentials
        documentSelector:
          path: kind
          value: Cluster

  - it: derives resource names from SQL names without changing the SQL identity
    values:
      - ../examples/existing.yaml
    set:
      database.name: Codecov_DB
      database.owner: Codecov_User
      databaseRoles.reader.name: Codecov_Reader
      databaseRoles.reader.login: false
      credentials.mode: generated
      enableSuperuserAccess: true
    asserts:
      - equal:
          path: metadata.name
          value: example-postgres-db-codecov-db
        documentSelector:
          path: kind
          value: Database
      - equal:
          path: spec.name
          value: Codecov_DB
        documentSelector:
          path: kind
          value: Database
      - equal:
          path: spec.owner
          value: Codecov_User
        documentSelector:
          path: kind
          value: Database
      - equal:
          path: metadata.name
          value: example-postgres-role-codecov-reader
        documentSelector:
          path: kind
          value: DatabaseRole
      - equal:
          path: spec.name
          value: Codecov_Reader
        documentSelector:
          path: kind
          value: DatabaseRole
      - equal:
          path: spec.bootstrap.initdb.secret
          value:
            name: example-postgres-codecov-user
        documentSelector:
          path: kind
          value: Cluster
      - equal:
          path: spec.superuserSecret
          value:
            name: example-postgres-superuser
        documentSelector:
          path: kind
          value: Cluster
      - matchRegex:
          path: metadata.name
          pattern: ^example-postgres-(codecov-user|superuser)$
        documentSelector:
          path: kind
          value: Password
          matchMany: true
      - isKind:
          of: Password
        template: credentials.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: example-postgres-codecov-user
        template: credentials.yaml
        documentIndex: 0
      - isKind:
          of: Password
        template: credentials.yaml
        documentIndex: 2
      - equal:
          path: metadata.name
          value: example-postgres-superuser
        template: credentials.yaml
        documentIndex: 2
      - matchRegex:
          path: spec.target.name
          pattern: ^example-postgres-(codecov-user|superuser)$
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: spec.target.creationPolicy
          value: Orphan
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: metadata.name
          value: example-postgres-codecov-user
        documentSelector:
          path: spec.target.name
          value: example-postgres-codecov-user
      - equal:
          path: spec.target.template.data.username
          value: Codecov_User
        documentSelector:
          path: spec.target.name
          value: example-postgres-codecov-user
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef.name
          value: example-postgres-codecov-user
        documentSelector:
          path: spec.target.name
          value: example-postgres-codecov-user
      - equal:
          path: metadata.name
          value: example-postgres-superuser
        documentSelector:
          path: spec.target.name
          value: example-postgres-superuser
      - equal:
          path: spec.target.template.data.username
          value: postgres
        documentSelector:
          path: spec.target.name
          value: example-postgres-superuser
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef.name
          value: example-postgres-superuser
        documentSelector:
          path: spec.target.name
          value: example-postgres-superuser

  - it: rejects a copied owner named superuser that collides with the superuser Secret
    values:
      - ../examples/recovery.yaml
    set:
      enableSuperuserAccess: true
      database.owner: superuser
      bootstrap.recovery.owner: superuser
      credentials.copy.superuserSecretName: source-admin
    asserts:
      - failedTemplate:
          errorPattern: database\.owner superuser collides with the superuser credential Secret

  - it: makes rotation and superuser access explicit with one password generator per Secret
    values:
      - ../examples/existing.yaml
    set:
      enableSuperuserAccess: true
      credentials.mode: generated
      credentials.rotation.enabled: true
      credentials.rotation.interval: 48h
    asserts:
      - matchRegex:
          path: spec.target.name
          pattern: ^example-postgres-(app|superuser)$
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: metadata.name
          value: example-postgres-app
        documentSelector:
          path: spec.target.name
          value: example-postgres-app
      - equal:
          path: metadata.name
          value: example-postgres-superuser
        documentSelector:
          path: spec.target.name
          value: example-postgres-superuser
      - matchRegex:
          path: metadata.name
          pattern: ^example-postgres-(app|superuser)$
        documentSelector:
          path: kind
          value: Password
          matchMany: true
      - isKind:
          of: Password
        template: credentials.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: example-postgres-app
        template: credentials.yaml
        documentIndex: 0
      - isKind:
          of: Password
        template: credentials.yaml
        documentIndex: 2
      - equal:
          path: metadata.name
          value: example-postgres-superuser
        template: credentials.yaml
        documentIndex: 2
      - equal:
          path: spec.target.template.data.dbname
          value: postgres
        documentSelector:
          path: spec.target.name
          value: example-postgres-superuser
      - matchRegex:
          path: spec.target.template.data.pgpass
          pattern: ':5432:\*:postgres:'
        documentSelector:
          path: spec.target.name
          value: example-postgres-superuser
      - equal:
          path: spec.refreshPolicy
          value: Periodic
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: spec.refreshInterval
          value: 48h
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: spec.target.immutable
          value: false
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef.name
          value: example-postgres-app
        documentSelector:
          path: spec.target.name
          value: example-postgres-app
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef.name
          value: example-postgres-superuser
        documentSelector:
          path: spec.target.name
          value: example-postgres-superuser

  - it: restricts recovery copy reads and retains copied Secrets after removal
    values:
      - ../examples/recovery.yaml
    set:
      enableSuperuserAccess: true
      credentials.copy.superuserSecretName: source-superuser
    asserts:
      - equal:
          path: spec.bootstrap.recovery.secret
          value:
            name: example-restored-recovery-app
        documentSelector:
          path: kind
          value: Cluster
      - equal:
          path: spec.superuserSecret
          value:
            name: example-restored-recovery-superuser
        documentSelector:
          path: kind
          value: Cluster
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - secrets
              resourceNames:
                - example-postgres-app
                - source-superuser
              verbs:
                - get
        documentSelector:
          path: kind
          value: Role
      - equal:
          path: automountServiceAccountToken
          value: false
        documentSelector:
          path: kind
          value: ServiceAccount
      - equal:
          path: spec.provider.kubernetes.remoteNamespace
          value: test
        documentSelector:
          path: kind
          value: SecretStore
      - equal:
          path: spec.provider.kubernetes.auth.serviceAccount.name
          value: example-restored-recovery-reader
        documentSelector:
          path: kind
          value: SecretStore
      - equal:
          path: spec.target.creationPolicy
          value: Orphan
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: spec.refreshPolicy
          value: CreatedOnce
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: spec.refreshInterval
          value: 0s
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - equal:
          path: spec.target.immutable
          value: true
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - matchRegex:
          path: spec.target.template.data.password
          pattern: source credential username
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - matchRegex:
          path: spec.target.template.data.uri
          pattern: example-restored-rw\.test
        documentSelector:
          path: kind
          value: ExternalSecret
          matchMany: true
      - isKind:
          of: Password
        not: true

  - it: refuses to copy credentials onto their own destination Secret
    values:
      - ../examples/recovery.yaml
    set:
      credentials.copy.userSecretName: example-restored-recovery-app
    asserts:
      - failedTemplate:
          errorPattern: differ from its destination

  - it: refuses to copy credentials into a different database identity
    values:
      - ../examples/recovery.yaml
    set:
      bootstrap.recovery.owner: different
    asserts:
      - failedTemplate:
          errorPattern: must match

  # The ESO template text is the behavior under test; helm-unittest cannot execute it.
  - it: escapes the password in every connection field
    values:
      - ../examples/existing.yaml
    set:
      credentials.mode: generated
      clusterDomain: internal.example
    asserts:
      - equal:
          path: spec.target.template.data
          value:
            username: app
            password: "{{ .password }}"
            host: example-postgres-rw
            port: "5432"
            dbname: app
            user: app
            pgpass: "example-postgres-rw:5432:app:app:{{ .password | replace \"\\\\\" \"\\\\\\\\\" | replace \":\" \"\\\\:\" }}\n"
            uri: "postgresql://app:{{ .password | urlquery | replace \"+\" \"%20\" }}@example-postgres-rw.test:5432/app"
            jdbc-uri: "jdbc:postgresql://example-postgres-rw.test:5432/app?password={{ .password | urlquery }}&user=app"
            fqdn-uri: "postgresql://app:{{ .password | urlquery | replace \"+\" \"%20\" }}@example-postgres-rw.test.svc.internal.example:5432/app"
            fqdn-jdbc-uri: "jdbc:postgresql://example-postgres-rw.test.svc.internal.example:5432/app?password={{ .password | urlquery }}&user=app"
        documentSelector:
          path: kind
          value: ExternalSecret

  # The ESO template text, including its username guard, is the behavior under test.
  - it: rejects a copied Secret with the wrong username instead of relabeling its password
    values:
      - ../examples/recovery.yaml
    asserts:
      - equal:
          path: spec.target.template.data
          value:
            username: app
            password: "{{ if ne .username \"app\" }}{{ fail \"source credential username does not match the restored role\" }}{{ end }}{{ .password }}"
            host: example-restored-rw
            port: "5432"
            dbname: app
            user: app
            pgpass: "example-restored-rw:5432:app:app:{{ .password | replace \"\\\\\" \"\\\\\\\\\" | replace \":\" \"\\\\:\" }}\n"
            uri: "postgresql://app:{{ .password | urlquery | replace \"+\" \"%20\" }}@example-restored-rw.test:5432/app"
            jdbc-uri: "jdbc:postgresql://example-restored-rw.test:5432/app?password={{ .password | urlquery }}&user=app"
            fqdn-uri: "postgresql://app:{{ .password | urlquery | replace \"+\" \"%20\" }}@example-restored-rw.test.svc.cluster.local:5432/app"
            fqdn-jdbc-uri: "jdbc:postgresql://example-restored-rw.test.svc.cluster.local:5432/app?password={{ .password | urlquery }}&user=app"
        documentSelector:
          path: kind
          value: ExternalSecret

  - it: renders no superuser Secret for an empty superuser reference
    values:
      - ../examples/existing.yaml
    set:
      credentials.existing.superuserSecretName: ""
    asserts:
      - notExists:
          path: spec.postgresql
        documentSelector:
          path: kind
          value: Cluster
      - notExists:
          path: spec.superuserSecret
        documentSelector:
          path: kind
          value: Cluster

  - it: lets a native bootstrap override the chart locales and secret
    values:
      - ../examples/existing.yaml
    set:
      bootstrap.initdb.database: app
      bootstrap.initdb.owner: app
      bootstrap.initdb.localeCType: POSIX
      bootstrap.initdb.secret.name: native-secret
      database.localeCType: en_US.UTF-8
      credentials.existing.userSecretName: nested-app
    asserts:
      - equal:
          path: spec.bootstrap.initdb.localeCType
          value: POSIX
        documentSelector:
          path: kind
          value: Cluster
      - equal:
          path: spec.bootstrap.initdb.secret.name
          value: native-secret
        documentSelector:
          path: kind
          value: Cluster

  - it: ignores existing Secret names in generated mode
    values:
      - ../examples/existing.yaml
    set:
      credentials.mode: generated
      credentials.existing.userSecretName: nested-app
      credentials.existing.superuserSecretName: nested-admin
    asserts:
      - equal:
          path: spec.bootstrap.initdb.secret
          value:
            name: example-postgres-app
        documentSelector:
          path: kind
          value: Cluster
      - notExists:
          path: spec.superuserSecret
        documentSelector:
          path: kind
          value: Cluster

  - it: rejects an owner whose generated Secret would collide with the ca Secret
    values:
      - ../examples/existing.yaml
    set:
      credentials.mode: generated
      database.owner: ca
    asserts:
      - failedTemplate:
          errorPattern: credential Secret "example-postgres-ca" would collide

  - it: rejects an owner whose generated Secret would collide with the server Secret
    values:
      - ../examples/existing.yaml
    set:
      credentials.mode: generated
      database.owner: server
    asserts:
      - failedTemplate:
          errorPattern: credential Secret "example-postgres-server" would collide

  - it: rejects an owner whose generated Secret would collide with the replication Secret
    values:
      - ../examples/existing.yaml
    set:
      credentials.mode: generated
      database.owner: replication
    asserts:
      - failedTemplate:
          errorPattern: credential Secret "example-postgres-replication" would collide

  - it: rejects an owner whose generated Secret would collide with the superuser Secret
    values:
      - ../examples/existing.yaml
    set:
      credentials.mode: generated
      database.owner: superuser
    asserts:
      - failedTemplate:
          errorPattern: credential Secret "example-postgres-superuser" would collide

  - it: rejects an owner whose generated Secret would collide with the backup-bucket Secret
    values:
      - ../examples/existing.yaml
    set:
      credentials.mode: generated
      database.owner: backup-bucket
    asserts:
      - failedTemplate:
          errorPattern: credential Secret "example-postgres-backup-bucket" would collide
