{{- $main := .Values.components.main -}}
{{- if or (ne $main.kind "Deployment") (ne (int $main.deployment.replicas) 1) (dig "hpa" "enabled" false $main) -}}
  {{- fail "blender: the authoring workspace requires one Deployment replica without HPA" -}}
{{- end -}}
{{- if ne $main.deployment.strategy.type "Recreate" -}}
  {{- fail "blender: use Recreate to avoid overlapping workspace writers" -}}
{{- end -}}
{{- if .Values.mcp.enabled -}}
  {{- if not (regexMatch "^[a-f0-9]{40}$" .Values.mcp.revision) -}}
    {{- fail "blender: mcp.revision must be a full Git commit SHA" -}}
  {{- end -}}
  {{- if not (regexMatch "^[a-f0-9]{64}$" .Values.mcp.sha256) -}}
    {{- fail "blender: mcp.sha256 must be the addon SHA-256" -}}
  {{- end -}}
{{- end -}}
{{- $scripts := dict -}}
{{- range $path, $_ := .Files.Glob "files/*.py" -}}
  {{- $_ := set $scripts (base $path) ($.Files.Get $path) -}}
{{- end -}}
{{- $resources := .Values.appResources | default dict -}}
{{- $maps := $resources.configMap | default dict -}}
{{- $_ := set $maps "bootstrap" (dict "data" $scripts) -}}
{{- $_ := set $resources "configMap" $maps -}}
{{- $_ := set .Values "appResources" $resources -}}
{{- $volumes := $main.pod.volumes -}}
{{- $_ := set $volumes "bootstrap" (dict "type" "configMap" "ref" "bootstrap" "mounts" (dict "/opt/blender-bootstrap" (dict "containers" (list "main" "prepare") "readOnly" true))) -}}
{{- $env := dict "PUID" $main.container.env.PUID "PGID" $main.container.env.PGID "MCP_ENABLED" (toString .Values.mcp.enabled) "MCP_REVISION" .Values.mcp.revision "MCP_SHA256" .Values.mcp.sha256 -}}
{{- $init := $main.initContainers | default dict -}}
{{- $_ := set $init "prepare" (dict "image" $main.container.image "command" (list "python3" "/opt/blender-bootstrap/prepare.py") "env" $env "resources" (dict "requests" (dict "cpu" "100m" "memory" "128Mi") "limits" (dict "memory" "256Mi"))) -}}
{{- $_ := set $main "initContainers" $init -}}
{{- if .Values.mcp.enabled -}}
  {{- $_ := set $main.container.env "BLENDER_USER_SCRIPTS" "/opt/blender-user-scripts" -}}
  {{- $_ := set $volumes "user-scripts" (dict "type" "emptyDir" "mounts" (dict "/opt/blender-user-scripts" (dict "containers" (list "main" "prepare")))) -}}
{{- end -}}
{{- $annotations := $main.pod.annotations | default dict -}}
{{- $_ := set $annotations "checksum/blender-bootstrap" (printf "%s%s" (toJson $scripts) (toJson .Values.mcp) | sha256sum) -}}
{{- $_ := set $main.pod "annotations" $annotations -}}
{{- include "common.all" . }}
