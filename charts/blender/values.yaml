mcp:
  enabled: false
  revision: 5f8ddaf6e987c4aa0c3467fcc548838b28f64477
  sha256: f43469c8518c7021e0060e32cfe52e3beb126b0f62fbae7293106642a3ebda89

appResources:
  configMap:
    bootstrap:
      tpl: true
      data:
        prepare.py: '{{ .Files.Get "files/prepare.py" }}'
        mcp_autostart.py: '{{ .Files.Get "files/mcp_autostart.py" }}'
        verify_gpu.py: '{{ .Files.Get "files/verify_gpu.py" }}'

  pvc:
    config:
      metadata:
        annotations:
          helm.sh/resource-policy: keep
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      spec:
        resources:
          requests:
            storage: 10Gi
        accessModes: [ReadWriteOnce]
      component: main
    workspace:
      metadata:
        annotations:
          helm.sh/resource-policy: keep
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      spec:
        resources:
          requests:
            storage: 50Gi
        accessModes: [ReadWriteOnce]
      component: main
components:
  main:
    kind: Deployment
    deployment:
      replicas: 1
      strategy:
        type: Recreate
    container:
      image:
        repository: lscr.io/linuxserver/blender
        tag: sha256:7dbfd0af8e75cde6fbe80cd0021a4819269d1d2fa9d854455c0fa18ffa14b118
      env:
        PUID: "1000"
        PGID: "1000"
        TZ: Etc/UTC
        BLENDER_USER_SCRIPTS: /opt/blender-user-scripts
      ports:
        http:
          port: 3000
          expose: 3000
        https:
          port: 3001
          expose: 3001
      probes:
        startup:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readiness:
          tcpSocket:
            port: http
          periodSeconds: 10
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          memory: 8Gi
      volumeMounts:
        bootstrap:
          name: bootstrap
          mountPath: /opt/blender-bootstrap
          readOnly: true
        user-scripts:
          name: user-scripts
          mountPath: /opt/blender-user-scripts
        config:
          name: config
          mountPath: /config
        workspace:
          name: workspace
          mountPath: /workspace
        shm:
          name: shm
          mountPath: /dev/shm
    initContainers:
      prepare:
        command: [python3, /opt/blender-bootstrap/prepare.py]
        env:
          PUID: '{{ .Values.components.main.container.env.PUID }}'
          PGID: '{{ .Values.components.main.container.env.PGID }}'
          MCP_ENABLED: '{{ .Values.mcp.enabled }}'
          MCP_REVISION: '{{ .Values.mcp.revision }}'
          MCP_SHA256: '{{ .Values.mcp.sha256 }}'
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        volumeMounts:
          bootstrap:
            name: bootstrap
            mountPath: /opt/blender-bootstrap
            readOnly: true
          user-scripts:
            name: user-scripts
            mountPath: /opt/blender-user-scripts
          config:
            name: config
            mountPath: /config
          workspace:
            name: workspace
            mountPath: /workspace
    pod:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      annotations:
        checksum/blender-bootstrap: '{{ include "common.checksum.configMap" (list . "bootstrap") }}'
      volumes:
        bootstrap:
          configMap:
            name: '{{ include "common.ref" (list . "configMap" "bootstrap") }}'
        user-scripts:
          emptyDir: {}
        config:
          persistentVolumeClaim:
            claimName: '{{ include "common.ref" (list . "pvc" "config") }}'
        workspace:
          persistentVolumeClaim:
            claimName: '{{ include "common.ref" (list . "pvc" "workspace") }}'
        shm:
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
    routes:
      main:
        enabled: false
        rules:
          - backendRefs:
              - port: 3000
