mcp:
  enabled: false
  version: 1.0.3
  sha256: a7a9da816192502e5a0a202a396444e266b47d8fc4f74ad4698048bd43040707

appResources:
  configMap:
    bootstrap:
      tpl: true
      data:
        prepare.sh: '{{ .Files.Get "files/prepare.sh" }}'
        mcp_autostart.py: '{{ .Files.Get "files/mcp_autostart.py" }}'
        verify_gpu.py: '{{ .Files.Get "files/verify_gpu.py" }}'
        start_server.py: '{{ .Files.Get "files/mcp-server/start_server.py" }}'
        requirements.txt: '{{ .Files.Get "files/mcp-server/requirements.txt" }}'

  pvc:
    config:
      metadata:
        annotations:
          helm.sh/resource-policy: keep
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      spec:
        resources:
          requests:
            storage: 10Gi
        accessModes: [ReadWriteOnce]
    workspace:
      metadata:
        annotations:
          helm.sh/resource-policy: keep
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      spec:
        resources:
          requests:
            storage: 50Gi
        accessModes: [ReadWriteOnce]
components:
  main:
    kind: Deployment
    deployment:
      replicas: 1
      strategy:
        type: Recreate
    container:
      image:
        repository: lscr.io/linuxserver/blender
        tag: 5.2.2-ls240
      env:
        PUID: "1000"
        PGID: "1000"
        TZ: Etc/UTC
        BLENDER_USER_SCRIPTS: /opt/blender-user-scripts
      ports:
        http:
          port: 3000
          expose: 3000
        https:
          port: 3001
          expose: 3001
      probes:
        startup:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readiness:
          tcpSocket:
            port: http
          periodSeconds: 10
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          memory: 8Gi
      volumeMounts:
        bootstrap:
          name: bootstrap
          mountPath: /opt/blender-bootstrap
          readOnly: true
        user-scripts:
          name: user-scripts
          mountPath: /opt/blender-user-scripts
        config:
          name: config
          mountPath: /config
        workspace:
          name: workspace
          mountPath: /workspace
        shm:
          name: shm
          mountPath: /dev/shm
    sidecars:
      mcp:
        enabled: '{{ .Values.mcp.enabled }}'
        command: [/lsiopy/bin/python3, /opt/blender-bootstrap/start_server.py]
        workingDir: /workspace
        env:
          HOME: /config
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
          BLENDER_MCP_HOST: 127.0.0.1
          BLENDER_MCP_PORT: "9876"
        ports:
          mcp:
            port: 8000
            expose: 8000
        probes:
          startup:
            tcpSocket:
              port: mcp
            periodSeconds: 5
            failureThreshold: 180
          readiness:
            tcpSocket:
              port: mcp
            periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        volumeMounts:
          bootstrap:
            name: bootstrap
            mountPath: /opt/blender-bootstrap
            readOnly: true
          config:
            name: config
            mountPath: /config
          workspace:
            name: workspace
            mountPath: /workspace
          tmp:
            name: mcp-tmp
            mountPath: /tmp
        securityContext:
          runAsNonRoot: true
          runAsUser: '{{ .Values.components.main.container.env.PUID }}'
          runAsGroup: '{{ .Values.components.main.container.env.PGID }}'
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
    initContainers:
      prepare:
        command: [/bin/bash, /opt/blender-bootstrap/prepare.sh]
        env:
          PUID: '{{ .Values.components.main.container.env.PUID }}'
          PGID: '{{ .Values.components.main.container.env.PGID }}'
          MCP_IMAGE: '{{ include "common.resolve.image" (dict "ctx" . "image" .Values.components.main.container.image) }}'
          MCP_ENABLED: '{{ .Values.mcp.enabled }}'
          MCP_VERSION: '{{ .Values.mcp.version }}'
          MCP_SHA256: '{{ .Values.mcp.sha256 }}'
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        volumeMounts:
          bootstrap:
            name: bootstrap
            mountPath: /opt/blender-bootstrap
            readOnly: true
          user-scripts:
            name: user-scripts
            mountPath: /opt/blender-user-scripts
          config:
            name: config
            mountPath: /config
          workspace:
            name: workspace
            mountPath: /workspace
    pod:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      annotations:
        checksum/blender-bootstrap: '{{ include "common.checksum.configMap" (list . "bootstrap") }}'
      volumes:
        mcp-tmp:
          enabled: '{{ .Values.mcp.enabled }}'
          emptyDir: {}
        bootstrap:
          configMap:
            name: '{{ include "common.ref" (list . "configMap" "bootstrap") }}'
        user-scripts:
          emptyDir: {}
        config:
          persistentVolumeClaim:
            claimName: '{{ include "common.ref" (list . "pvc" "config") }}'
        workspace:
          persistentVolumeClaim:
            claimName: '{{ include "common.ref" (list . "pvc" "workspace") }}'
        shm:
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
    routes:
      main:
        enabled: false
        rules:
          - backendRefs:
              - port: 3000
      mcp:
        enabled: false
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /
            timeouts:
              request: 360s
              backendRequest: 350s
            backendRefs:
              - port: 8000
