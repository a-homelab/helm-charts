suite: schema rejects unsafe authoring configuration
templates:
  - templates/all.yaml
release:
  name: test
  namespace: default
tests:
  - it: rejects more than one replica
    set:
      mcp.enabled: true
      components.main.deployment.replicas: 2
    asserts:
      - failedTemplate:
          errorPattern: (?i)schema
      - failedTemplate:
          errorPattern: components(\.|/)main(\.|/)deployment(\.|/)replicas

  - it: rejects a RollingUpdate strategy
    set:
      mcp.enabled: true
      components.main.deployment.strategy.type: RollingUpdate
    asserts:
      - failedTemplate:
          errorPattern: (?i)schema
      - failedTemplate:
          errorPattern: components(\.|/)main(\.|/)deployment(\.|/)strategy(\.|/)type

  - it: rejects a StatefulSet main component
    set:
      mcp.enabled: true
      components.main.kind: StatefulSet
    asserts:
      - failedTemplate:
          errorPattern: (?i)schema
      - failedTemplate:
          errorPattern: components(\.|/)main(\.|/)kind

  - it: rejects an HPA on the main component
    set:
      mcp.enabled: true
      components.main.hpa.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: (?i)schema
      - failedTemplate:
          errorPattern: components(\.|/)main(\.|/)hpa(\.|/)enabled

  - it: rejects an MCP version that is not a release
    set:
      mcp.enabled: true
      mcp.version: main
    asserts:
      - failedTemplate:
          errorPattern: (?i)schema
      - failedTemplate:
          errorPattern: mcp(\.|/)version

  - it: rejects an MCP checksum that is not a SHA-256 digest
    set:
      mcp.enabled: true
      mcp.sha256: bad
    asserts:
      - failedTemplate:
          errorPattern: (?i)schema
      - failedTemplate:
          errorPattern: mcp(\.|/)sha256

  - it: rejects the removed mcp.server toggle
    set:
      mcp.server.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: (?i)schema

  - it: rejects the MCP route while MCP is disabled
    set:
      components.main.routes.mcp.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: (?i)schema
