suite: Password users
templates:
  - templates/kafka.yaml
  - templates/kafkauser.yaml
  - templates/certificate-client.yaml
  - templates/certificaterequestpolicy-clients-ca.yaml
  - templates/password-user.yaml
  - templates/externalsecret-user-password.yaml
  - templates/role-user-passwords.yaml
  - templates/rolebinding-user-passwords.yaml
release:
  name: loki-kafka
  namespace: loki
values:
  - ../examples/loki.yaml
tests:
  - it: adds a plaintext SASL PLAIN listener that reads each password from its Secret
    template: templates/kafka.yaml
    asserts:
      - lengthEqual:
          path: spec.kafka.listeners
          count: 2
      - equal:
          path: spec.kafka.listeners[1]
          value:
            name: plain
            port: 9092
            type: internal
            tls: false
            authentication:
              type: custom
              sasl: true
              listenerConfig:
                sasl.enabled.mechanisms: PLAIN
                plain.sasl.jaas.config: >-
                  org.apache.kafka.common.security.plain.PlainLoginModule required
                  user_loki="${strimzisecrets:loki/loki-kafka-password:password}";

  - it: lists every password user in the JAAS config, sorted
    template: templates/kafka.yaml
    set:
      users.alloy:
        authMethod: password
        acls: [{resource: {type: topic, name: loki-ingest, patternType: literal}, operations: [Write]}]
    asserts:
      - equal:
          path: spec.kafka.listeners[1].authentication.listenerConfig["plain.sasl.jaas.config"]
          value: >-
            org.apache.kafka.common.security.plain.PlainLoginModule required
            user_alloy="${strimzisecrets:loki/alloy-kafka-password:password}"
            user_loki="${strimzisecrets:loki/loki-kafka-password:password}";

  - it: limits the plaintext listener to the client peers too
    template: templates/kafka.yaml
    set:
      kafka.clientPeers:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: loki
    asserts:
      - equal:
          path: spec.kafka.listeners[1].networkPolicyPeers
          value:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: loki

  - it: leaves the authentication type off a password user, so its principal is User:<user>
    template: templates/kafkauser.yaml
    asserts:
      - notExists:
          path: spec.authentication
      - equal:
          path: spec.authorization.type
          value: simple

  - it: issues no client certificate to a password user
    template: templates/certificate-client.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: admits no password user's name as a certificate CN
    template: templates/certificaterequestpolicy-clients-ca.yaml
    asserts:
      - equal:
          path: spec.allowed.commonName.validations[0].rule
          value: self in []

  - it: generates a password of letters and digits only, a wave before the cluster
    template: templates/password-user.yaml
    asserts:
      - equal:
          path: metadata.name
          value: loki-kafka-password
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "-2"
      - equal:
          path: spec
          value:
            length: 32
            digits: 8
            symbols: 0
            noUpper: false
            allowRepeat: true

  - it: writes the password once into a basic-auth Secret that outlives the ExternalSecret
    template: templates/externalsecret-user-password.yaml
    asserts:
      - equal:
          path: spec.refreshPolicy
          value: CreatedOnce
      - equal:
          path: spec.target
          value:
            name: loki-kafka-password
            creationPolicy: Orphan
            deletionPolicy: Retain
            immutable: true
            template:
              engineVersion: v2
              type: kubernetes.io/basic-auth
              data:
                username: loki
                password: "{{ .password }}"
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef
          value:
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: Password
            name: loki-kafka-password

  - it: lets the brokers read only the password Secrets
    template: templates/role-user-passwords.yaml
    asserts:
      - equal:
          path: metadata.name
          value: loki-kafka-kafka-user-passwords
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              verbs: [get]
              resourceNames: [loki-kafka-password]

  - it: binds the Role to Strimzi's broker ServiceAccount
    template: templates/rolebinding-user-passwords.yaml
    asserts:
      - equal:
          path: roleRef.name
          value: loki-kafka-kafka-user-passwords
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: loki-kafka-kafka
              namespace: loki

  - it: renders no password resources or plaintext listener without a password user
    set:
      users.loki.authMethod: certificate
    asserts:
      - lengthEqual:
          path: spec.kafka.listeners
          count: 1
        template: templates/kafka.yaml
      - hasDocuments:
          count: 0
        template: templates/password-user.yaml
      - hasDocuments:
          count: 0
        template: templates/externalsecret-user-password.yaml
      - hasDocuments:
          count: 0
        template: templates/role-user-passwords.yaml
      - hasDocuments:
          count: 0
        template: templates/rolebinding-user-passwords.yaml
