suite: Kafka
templates:
  - templates/kafka.yaml
release:
  name: mimir-kafka
  namespace: mimir
values:
  - ../examples/mimir.yaml
tests:
  - it: trusts only this cluster's own CAs, through namespaced Issuers
    asserts:
      - equal:
          path: spec.clusterCa
          value:
            generateCertificateAuthority: false
            type: cert-manager
            certManager:
              issuerRef:
                name: mimir-kafka-cluster-ca-root
                kind: Issuer
                group: cert-manager.io
              caCertRef:
                secretName: mimir-kafka-cluster-ca-root
                certificate: ca.crt
      - equal:
          path: spec.clientsCa.certManager
          value:
            issuerRef:
              name: mimir-kafka-clients-ca-root
              kind: Issuer
              group: cert-manager.io
            caCertRef:
              secretName: mimir-kafka-clients-ca-root
              certificate: ca.crt

  - it: carries no labels, which Strimzi would copy onto every pod
    asserts:
      - notExists:
          path: metadata.labels
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "-1"

  - it: merges the release's config over the replication defaults
    asserts:
      - equal:
          path: spec.kafka.config
          value:
            offsets.topic.replication.factor: 3
            transaction.state.log.replication.factor: 3
            transaction.state.log.min.isr: 2
            default.replication.factor: 3
            min.insync.replicas: 2
            auto.create.topics.enable: false
            message.max.bytes: 16000000

  - it: drops a default the release sets to null
    values:
      - ../examples/mimir.yaml
      - values/drop-min-insync-replicas.yaml
    asserts:
      - notExists:
          path: spec.kafka.config["min.insync.replicas"]
      - equal:
          path: spec.kafka.config["default.replication.factor"]
          value: 3

  - it: authenticates clients by certificate on the one TLS listener
    asserts:
      - equal:
          path: spec.kafka.listeners
          value:
            - name: tls
              port: 9093
              type: internal
              tls: true
              authentication:
                type: tls
              networkPolicyPeers:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: mimir
      - equal:
          path: spec.kafka.authorization.type
          value: simple

  - it: leaves networkPolicyPeers to Strimzi when no client peers are set
    set:
      kafka.clientPeers: []
    asserts:
      - notExists:
          path: spec.kafka.listeners[0].networkPolicyPeers

  - it: leaves the sync wave off when syncWave is empty
    set:
      syncWave: ""
    asserts:
      - notExists:
          path: metadata.annotations

  - it: names the cluster after the release when fullnameOverride is empty
    set:
      fullnameOverride: ""
    release:
      name: tempo
    asserts:
      - equal:
          path: metadata.name
          value: tempo-kafka
      - equal:
          path: spec.clusterCa.certManager.issuerRef.name
          value: tempo-kafka-cluster-ca-root

  - it: requires the Kafka version
    set:
      kafka.version: ""
    asserts:
      - failedTemplate:
          errorMessage: kafka.version is required

  - it: requires the metadata version
    set:
      kafka.metadataVersion: ""
    asserts:
      - failedTemplate:
          errorMessage: kafka.metadataVersion is required
