{{- /*
The Issuer every user's client certificate names (certificate-client.yaml), signing with the clients
CA (certificate-clients-ca.yaml). certificaterequestpolicy-clients-ca.yaml limits it to this
release's users.
*/}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: "{{ include "kafka.fullname" . }}-clients-ca-root"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ include "kafka.syncWaveBefore" (dict "root" . "by" 1) | quote }}
spec:
  ca:
    secretName: "{{ include "kafka.fullname" . }}-clients-ca-root"
