{{- /*
Each password user's password generator, read once by externalsecret-user-password.yaml. Letters
and digits only: the password sits inside a quoted JAAS string on the brokers (kafka.yaml) and in
clients' environment-expanded configs, where quotes, backslashes and $ would need escaping.
Rendered a wave before the cluster, so the Secret exists when the brokers first start.
*/}}
{{- range $user := include "kafka.passwordUserNames" . | fromYamlArray }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: "{{ $user }}-kafka-password"
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "kafka.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ include "kafka.syncWaveBefore" (dict "root" $ "by" 1) | quote }}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- end }}
