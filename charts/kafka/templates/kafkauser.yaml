{{- /*
Each user, with its ACLs. A certificate user is tls-external: cert-manager issues its certificate
(certificate-client.yaml), so the User Operator manages only the ACLs, as in Strimzi 1.3.1's
tls-external example. A password user has no authentication type: the plain listener in kafka.yaml
checks its password, and the User Operator writes ACLs for principal User:<user>.
*/}}
{{- range $user, $spec := .Values.users }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ $user | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    strimzi.io/cluster: {{ include "kafka.fullname" $ | quote }}
  {{- with include "kafka.syncWaveAnnotation" $ }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if eq ($spec.authMethod | default "certificate") "certificate" }}
  authentication:
    type: tls-external
  {{- end }}
  authorization:
    type: simple
    acls:
      {{- required (printf "users.%s.acls is required" $user) $spec.acls | toYaml | nindent 6 }}
{{- end }}
