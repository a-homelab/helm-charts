{{- /*
Each password user's Secret <user>-kafka-password, generated once from password-user.yaml. The
brokers read it at start (kafka.yaml, role-user-passwords.yaml) and the client mounts it.
CreatedOnce, immutable, Orphan and Retain keep the password stable: deleting or recreating the
ExternalSecret never generates a new one, which would lock the client out until both the brokers
and the client restart.
*/}}
{{- range $user := include "kafka.userNames" (dict "root" . "authMethod" "password") | fromYamlArray }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ $user }}-kafka-password"
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "kafka.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ include "kafka.syncWaveBefore" (dict "root" $ "by" 1) | quote }}
spec:
  # CreatedOnce never refreshes. The explicit 0s keeps the CRD default of 1h from suggesting a
  # schedule.
  refreshPolicy: CreatedOnce
  refreshInterval: "0s"
  target:
    name: "{{ $user }}-kafka-password"
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: {{ $user | quote }}
        {{- /* An External Secrets template, evaluated by ESO rather than Helm. */}}
        password: {{ `{{ .password }}` | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: "{{ $user }}-kafka-password"
{{- end }}
