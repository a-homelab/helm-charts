{{- /*
Binds role-user-passwords.yaml to <cluster>-kafka, the ServiceAccount Strimzi 1.3.1 gives every
broker and controller pod (KafkaResources.kafkaComponentName).
*/}}
{{- if include "kafka.userNames" (dict "root" . "authMethod" "password") | fromYamlArray }}
{{- $name := include "kafka.fullname" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ $name }}-kafka-user-passwords"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ include "kafka.syncWaveBefore" (dict "root" . "by" 1) | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ $name }}-kafka-user-passwords"
subjects:
  - kind: ServiceAccount
    name: "{{ $name }}-kafka"
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
