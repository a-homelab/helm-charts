{{- /*
The Issuer Strimzi requests every broker, controller and operator certificate from, signing with the
cluster CA (certificate-cluster-ca.yaml). certificaterequestpolicy-cluster-ca.yaml limits what it
signs.
*/}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: "{{ include "kafka.fullname" . }}-cluster-ca-root"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ include "kafka.syncWaveBefore" (dict "root" . "by" 1) | quote }}
spec:
  ca:
    secretName: "{{ include "kafka.fullname" . }}-cluster-ca-root"
