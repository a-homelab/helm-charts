{{- /*
Shaped after Strimzi 1.3.1's metrics example: dedicated controller and broker pools (nodepool.yaml),
TLS client authentication and simple authorization. Users with authMethod password log in with
SASL PLAIN on the sasltls listener, and those marked plaintext also on the plain listener;
role-user-passwords.yaml lets the brokers read their passwords.
https://github.com/strimzi/strimzi-kafka-operator/blob/1.3.1/packaging/examples/metrics/strimzi-metrics-reporter/kafka-metrics.yaml

Strimzi's cert-manager mode, Early Access since 1.3.0, has cert-manager issue and renew every broker,
controller and operator certificate. Both CAs are this cluster's own (certificate-cluster-ca.yaml,
certificate-clients-ca.yaml): a certificate for another Kafka cluster is rejected here, including
Strimzi's cluster-operator certificate, whose CN is the same in every cluster and is a super user.
Strimzi copies each CA's certificate from caCertRef into its own <cluster>-cluster-ca-cert and
<cluster>-clients-ca-cert Secrets, which is what clients and pods mount; nothing mounts the CA
Secrets.
*/}}
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ include "kafka.fullname" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  {{- with include "kafka.syncWaveAnnotation" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  clusterCa:
    generateCertificateAuthority: false
    type: cert-manager
    certManager:
      issuerRef:
        name: "{{ include "kafka.fullname" . }}-cluster-ca-root"
        kind: Issuer
        group: cert-manager.io
      caCertRef:
        secretName: "{{ include "kafka.fullname" . }}-cluster-ca-root"
        certificate: ca.crt
  clientsCa:
    generateCertificateAuthority: false
    type: cert-manager
    certManager:
      issuerRef:
        name: "{{ include "kafka.fullname" . }}-clients-ca-root"
        kind: Issuer
        group: cert-manager.io
      caCertRef:
        secretName: "{{ include "kafka.fullname" . }}-clients-ca-root"
        certificate: ca.crt
  kafka:
    version: {{ required "kafka.version is required" .Values.kafka.version | quote }}
    metadataVersion: {{ required "kafka.metadataVersion is required" .Values.kafka.metadataVersion | quote }}
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        # Client certificates from the clients CA; the CN is the KafkaUser name.
        authentication:
          type: tls
        {{- with .Values.kafka.clientPeers }}
        networkPolicyPeers:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with include "kafka.plaintextUserNames" . | fromYamlArray }}
      # SASL PLAIN without TLS, only for the password users marked plaintext, whose client cannot
      # do TLS. Kafka ACLs cannot limit a user to a listener, so this listener's JAAS config lists
      # only them.
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: custom
          sasl: true
          listenerConfig:
            sasl.enabled.mechanisms: PLAIN
            plain.sasl.jaas.config: {{ include "kafka.plainJaasConfig" (dict "root" $ "users" .) | quote }}
        {{- with $.Values.kafka.clientPeers }}
        networkPolicyPeers:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with include "kafka.passwordUserNames" . | fromYamlArray }}
      # SASL PLAIN over TLS, for every password user. The server certificate is the brokers' own,
      # from the cluster CA; no client certificate is asked for.
      - name: sasltls
        port: 9094
        type: internal
        tls: true
        authentication:
          type: custom
          sasl: true
          listenerConfig:
            sasl.enabled.mechanisms: PLAIN
            plain.sasl.jaas.config: {{ include "kafka.plainJaasConfig" (dict "root" $ "users" .) | quote }}
        {{- with $.Values.kafka.clientPeers }}
        networkPolicyPeers:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
    authorization:
      type: simple
    {{- with .Values.kafka.config }}
    config:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    metricsConfig:
      type: strimziMetricsReporter
  entityOperator:
    topicOperator:
      resources:
        {{- toYaml .Values.entityOperator.topicOperator.resources | nindent 8 }}
    userOperator:
      resources:
        {{- toYaml .Values.entityOperator.userOperator.resources | nindent 8 }}
