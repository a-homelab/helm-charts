{{- /*
THIS CLUSTER'S CLIENT TRUST BOUNDARY: a self-signed root chained to nothing. It signs the users'
certificates (certificate-client.yaml, through issuer-clients-ca.yaml), and is the only CA the client
listener trusts. Sharing it with another Kafka cluster would let that cluster's users log in here.

The cluster's identity goes in organizational units, not the commonName: X.509 caps a commonName at
64 bytes (RFC 5280 ub-common-name), while a namespace and a fullname may each be 63.

The name, <cluster>-clients-ca-root, is shared by this Certificate, its Secret and its Issuer
(issuer-clients-ca.yaml). The -root suffix keeps it apart from Strimzi's own <cluster>-clients-ca and
<cluster>-clients-ca-cert Secrets.

rotationPolicy Never: a renewal must re-sign the same key, or every leaf signed by the old key fails
until it renews. Renewing a year early keeps the copy Strimzi holds from ever expiring.
*/}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "{{ include "kafka.fullname" . }}-clients-ca-root"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ include "kafka.syncWaveBefore" (dict "root" . "by" 1) | quote }}
spec:
  isCA: true
  commonName: Ben Fu Homelab Strimzi Clients CA
  secretName: "{{ include "kafka.fullname" . }}-clients-ca-root"
  subject:
    organizations:
      - Ben Fu Homelab
    organizationalUnits:
      - {{ .Release.Namespace | quote }}
      - {{ include "kafka.fullname" . | quote }}
  duration: 87600h0m0s # 10y
  renewBefore: 8760h0m0s # 1y
  revisionHistoryLimit: 10
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Never
  usages:
    - digital signature
    - cert sign
    - crl sign
  issuerRef:
    name: "{{ include "kafka.fullname" . }}-ca-selfsigned"
    kind: Issuer
    group: cert-manager.io
