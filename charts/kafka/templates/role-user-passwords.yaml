{{- /*
Lets the brokers read the password users' Secrets, which the plain listener's JAAS config in
kafka.yaml references through Strimzi's KubernetesSecretConfigProvider. Strimzi's own Role,
<cluster>-kafka, names only its certificate Secrets. Bound to the brokers' ServiceAccount by
rolebinding-user-passwords.yaml.
*/}}
{{- with include "kafka.userNames" (dict "root" . "authMethod" "password") | fromYamlArray }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "kafka.fullname" $ }}-kafka-user-passwords"
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "kafka.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ include "kafka.syncWaveBefore" (dict "root" $ "by" 1) | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames:
      {{- range . }}
      - "{{ . }}-kafka-password"
      {{- end }}
{{- end }}
