{{- /*
Strimzi 1.3.1's Entity Operator PodMonitor, scoped to this release's namespace instead of the
example's "myproject":
https://github.com/strimzi/strimzi-kafka-operator/blob/1.3.1/packaging/examples/metrics/prometheus-install/pod-monitors/entity-operator-metrics.yaml
*/}}
{{- if .Values.podMonitors.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: entity-operator-metrics
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: entity-operator
  podMetricsEndpoints:
    - path: /metrics
      port: healthcheck-to
    - path: /metrics
      port: healthcheck-uo
{{- end }}
