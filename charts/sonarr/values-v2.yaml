# yaml-language-server: $schema=../common/schema/values.schema.json
# Migration values for the new common library (see charts/common/README.md).
# Rendered and schema-checked as a migration example. Main component selectors
# intentionally differ from the legacy library; see scripts/verify-common-migration.py.
components:
  main:
    container:
      name: '{{ include "common.fullname" . }}'
      image:
        repository: lscr.io/linuxserver/sonarr
      env:
        TZ: America/Chicago
        PUID: "1000"
        PGID: "1000"
      ports:
        http:
          port: 8989
      volumeMounts:
        config:
          name: config
          mountPath: /config
    pod:
      securityContext:
        fsGroup: 1000
      volumes:
        config:
          persistentVolumeClaim:
            claimName: '{{ include "common.ref" (list . "pvc" "config") }}'
    deployment:
      strategy:
        type: Recreate
appResources:
  pvc:
    config:
      spec:
        resources:
          requests:
            storage: 1Gi
        storageClassName: my-storage-class
        accessModes:
          - ReadWriteOnce
      component: main
