# Recyclarr's own settings. config is recyclarr.yml, rendered verbatim, so its
# keys are Recyclarr's: https://recyclarr.dev/reference/configuration/
# It is a string, not a map, so YAML tags such as !secret survive Helm.
recyclarr:
  config: ""
  # An existing Secret with a secrets.yml key, mounted beside recyclarr.yml for
  # !secret tags: https://recyclarr.dev/reference/configuration/value-substitution/#secrets
  secretName: ""

appResources:
  configMap:
    # Read at each run's start, so a change applies from the next run.
    config:
      tpl: true
      data:
        recyclarr.yml: '{{ required "recyclarr.config is empty: supply recyclarr.yml" .Values.recyclarr.config }}'
  # The image's RECYCLARR_CONFIG_DIR. Recyclarr also keeps its clones of the
  # TRaSH Guides and config-templates repositories, its cache and its logs
  # there, so a run fetches only what changed.
  pvc:
    data:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

components:
  main:
    kind: CronJob
    cronjob:
      schedule: "0 * * * *"
      # A run that outlasts the hour must not overlap the next, which would
      # sync the same instances twice.
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 300
    job:
      # Each attempt gets its own pod, so a failed run's log stays readable.
      # One retry covers a transient fetch or API error; a config error
      # fails the same way every time.
      restartPolicy: Never
      backoffLimit: 1
    container:
      # The tag defaults to appVersion. The image's entrypoint runs
      # `recyclarr <args>` under tini.
      image:
        repository: ghcr.io/recyclarr/recyclarr
      args:
        - sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      # Not tuned until measured.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      volumeMounts:
        data:
          name: data
          mountPath: /config
        config:
          name: config
          mountPath: /config/recyclarr.yml
          subPath: recyclarr.yml
          readOnly: true
        secrets:
          enabled: '{{ ne .Values.recyclarr.secretName "" }}'
          name: secrets
          mountPath: /config/secrets.yml
          subPath: secrets.yml
          readOnly: true
        tmp:
          name: tmp
          mountPath: /tmp
    pod:
      automountServiceAccountToken: false
      # The image's user owns /config, so the volume must be writable by it.
      securityContext:
        fsGroup: 1000
      volumes:
        data:
          persistentVolumeClaim:
            claimName: '{{ include "common.ref" (list . "pvc" "data") }}'
        config:
          configMap:
            ref: config
            defaultMode: 0400
        secrets:
          enabled: '{{ ne .Values.recyclarr.secretName "" }}'
          secret:
            secretName: '{{ .Values.recyclarr.secretName }}'
            defaultMode: 0400
        tmp:
          emptyDir:
            sizeLimit: 1Gi
