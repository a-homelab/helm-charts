suite: persistence (volumes, PVCs, mounts)
templates:
  - templates/all.yaml
release:
  name: t
  namespace: test
tests:
  - it: emits the chart-level PVC and references it from the pod
    asserts:
      - isKind:
          of: PersistentVolumeClaim
        documentIndex: 4
      - equal:
          path: metadata.name
          value: t-common-tests-config
        documentIndex: 4
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
        documentIndex: 4
      - equal:
          path: spec.accessModes
          value: [ReadWriteOnce]
        documentIndex: 4
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            persistentVolumeClaim:
              claimName: t-common-tests-config
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /config
        documentIndex: 0

  - it: honors native storageClassName and accessModes on PVCs
    set:
      appResources:
        pvc:
          config:
            spec:
              storageClassName: fast
              accessModes: [ReadWriteMany]
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast
        documentIndex: 4
      - equal:
          path: spec.accessModes
          value: [ReadWriteMany]
        documentIndex: 4

  - it: mounts existing claims without emitting a PVC
    set:
      components:
        main:
          pod:
            volumes:
              media:
                persistentVolumeClaim:
                  claimName: nas-media
          container:
            volumeMounts:
              media:
                name: media
                mountPath: /media
                readOnly: true
    asserts:
      - hasDocuments:
          count: 5
      - contains:
          path: spec.template.spec.volumes
          content:
            name: media
            persistentVolumeClaim:
              claimName: nas-media
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: media
            mountPath: /media
            readOnly: true
        documentIndex: 0

  - it: resolves configMap volume ref to the extras resource name
    set:
      appResources:
        configMap:
          settings:
            data:
              a: b
      components:
        main:
          pod:
            volumes:
              settings:
                configMap:
                  name: '{{ include "common.ref" (list . "configMap" "settings") }}'
          container:
            volumeMounts:
              settings:
                name: settings
                mountPath: /etc/app
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: settings
            configMap:
              name: t-common-tests-settings
        documentIndex: 0

  - it: supports emptyDir with sizeLimit and subPath mounts
    set:
      components:
        main:
          pod:
            volumes:
              scratch:
                emptyDir:
                  sizeLimit: 2Gi
          container:
            volumeMounts:
              scratch:
                name: scratch
                mountPath: /tmp/work
                subPath: work
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scratch
            emptyDir:
              sizeLimit: 2Gi
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: scratch
            mountPath: /tmp/work
            subPath: work
        documentIndex: 0

  - it: passes native hostPath volume sources through verbatim
    set:
      components:
        main:
          pod:
            volumes:
              tuntap:
                hostPath:
                  path: /dev/net/tun
          container:
            volumeMounts:
              tuntap:
                name: tuntap
                mountPath: /dev/net/tun
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tuntap
            hostPath:
              path: /dev/net/tun
        documentIndex: 0

  - it: deletes an explicitly selected volume, mount and PVC via null
    values:
      - values/volume-delete.yaml
    asserts:
      - hasDocuments:
          count: 4
      - notExists:
          path: spec.template.spec.volumes
        documentIndex: 0
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
        documentIndex: 0

  - it: renders statefulset volumeClaimTemplates with mounts and no standalone PVC
    values:
      - ../ci/controllers-values.yaml
    asserts:
      - isKind:
          of: StatefulSet
        documentIndex: 0
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: data
        documentIndex: 0
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: fast
        documentIndex: 0
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 10Gi
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/lib/db
        documentIndex: 0

  - it: renders standalone PVCs from extras
    set:
      appResources:
        pvc:
          shared:
            spec:
              resources:
                requests:
                  storage: 100Gi
              accessModes: [ReadWriteMany]
              storageClassName: nfs
    asserts:
      - hasDocuments:
          count: 6
      - isKind:
          of: PersistentVolumeClaim
        documentIndex: 5
      - equal:
          path: metadata.name
          value: t-common-tests-shared
        documentIndex: 5
      - equal:
          path: spec.storageClassName
          value: nfs
        documentIndex: 5
