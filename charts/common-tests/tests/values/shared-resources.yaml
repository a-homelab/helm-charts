# Shared-resources exercise: chart-scoped PVC/configMap/secret/certificate
# consumed from two components via refs, a chart-scoped HTTPRoute fanning
# one hostname across components, and a component-scoped appResources entry.
global:
  domain: example.com
  gateway:
    name: internal
    namespace: gateways
  certIssuer:
    name: letsencrypt-prod

components:
  main:
  api:
    container:
      image:
        repository: ghcr.io/example/app
      ports:
        http:
          port: 8080
      env:
        CONFIG_NAME: '{{ include "common.ref" (list . "configMap" "shared-config") }}'
        API_KEY:
          valueFrom:
            secretKeyRef:
              ref: creds
              key: api-key
      envFrom:
        settings:
          configMapRef:
            ref: shared-config
      volumeMounts:
        media:
          name: media
          mountPath: /media
        tls:
          name: tls
          mountPath: /tls
          readOnly: true
    pod:
      volumes:
        media:
          persistentVolumeClaim:
            claimName: '{{ include "common.ref" (list . "pvc" "media") }}'
        tls:
          secret:
            secretName: '{{ include "common.ref.tlsSecret" (list . "web") }}'
  worker:
    container:
      image:
        repository: ghcr.io/example/app
      command: [./worker]
      ports:
        metrics:
          port: 9090
      volumeMounts:
        media:
          name: media
          mountPath: /library
          readOnly: true
    pod:
      volumes:
        media:
          persistentVolumeClaim:
            claimName: '{{ include "common.ref" (list . "pvc" "media") }}'
appResources:
  pvc:
    media:
      spec:
        resources:
          requests:
            storage: 100Gi
        accessModes: [ReadWriteMany]
        storageClassName: nfs
    config:
  configMap:
    shared-config:
      data:
        a: b
    config:
      component: worker
      data:
        w: x
  secret:
    creds:
      stringData:
        api-key: zzz
  certificate:
    web: {}
  route:
    web:
      hostnames:
        - "app.{{ .Values.global.domain }}"
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /metrics
          backendRefs:
            - component: worker
              port: metrics
        - backendRefs:
            - component: api
