# yaml-language-server: $schema=../common/schema/values.schema.json
# Default harness values: minimal single-app chart (sonarr-like).
# The implicit "main" component renders Deployment, Service, ServiceAccount,
# HTTPRoute and a PVC from ~25 lines of values.
global:
  domain: example.com
  gateway:
    name: internal
    namespace: gateways

components:
  main:
    container:
      image:
        repository: lscr.io/linuxserver/sonarr
      env:
        TZ: America/Chicago
        PUID: "1000"
        PGID: "1000"
      ports:
        http:
          port: 8989
      volumeMounts:
        config:
          name: config
          mountPath: /config
    pod:
      securityContext:
        fsGroup: 1000
      volumes:
        config:
          persistentVolumeClaim:
            claimName: '{{ include "common.ref" (list . "pvc" "config") }}'
    deployment:
      strategy:
        type: Recreate
    routes:
      main:
        enabled: true
appResources:
  pvc:
    config:
      spec:
        resources:
          requests:
            storage: 1Gi
        accessModes:
          - ReadWriteOnce
      component: main
