# yaml-language-server: $schema=../../common/schema/values.schema.json
# Multi-component exercise: shared defaults, api with sidecar + init +
# configMap volume + route, worker without service, nightly cronjob.
# Also exercises: disabled Services, inherited env deletion, tolerations map,
# overrides at container/pod/resource altitude, extras, hpa, pdb.
global:
  domain: example.com
  gateway:
    name: internal
    namespace: gateways
  externalSecrets:
    storeName: default-store

labels:
  team: platform
annotations:
  example.com/owner: ben

defaults:
  container:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
    env:
      LOG_LEVEL: info
      DEPRECATED: to-be-deleted
  pod:
    securityContext:
      runAsNonRoot: true

components:
  main:                                    # delete the component declared by the harness values.yaml
  api:
    remove: [/container/env/DEPRECATED]
    container:
      image:
        repository: ghcr.io/example/app
      env:
        DB_HOST: "{{ .Release.Name }}-pg-rw"
      ports:
        http:
          port: 8080
      probes:
        readiness:
          httpGet:
            path: /healthz
            port: http
      overrides:
        terminationMessagePolicy: FallbackToLogsOnError   # unmodeled field via container overrides
      volumeMounts:
        config:
          name: config
          mountPath: /etc/app
    sidecars:
      oauth-proxy:
        image:
          repository: quay.io/oauth2-proxy/oauth2-proxy
          tag: v7.6.0
        ports:
          proxy:
            port: 4180
            expose: 80
        volumeMounts:
          config-2:
            name: config
            mountPath: /etc/proxy
            readOnly: true
    initContainers:
      10-migrate:                          # inherits main image
        command: [./migrate]
    pod:
      tolerations:
        arch:
          key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      volumes:
        config:
          configMap:
            name: '{{ include "common.ref" (list . "configMap" "app-config") }}'
      annotations:
        checksum/config: '{{ .Values.appResources.configMap | toYaml | sha256sum }}'
    services:
      main:
        ports:
          proxy: {}
    routes:
      main:
        enabled: true
        hostnames:
          - "app.{{ .Values.global.domain }}"
    hpa:
      enabled: true
      min: 2
      max: 5
      targetCPU: 80
    pdb:
      enabled: true
      minAvailable: 1

  worker:
    container:
      image:
        repository: ghcr.io/example/app
      command: [./worker]
    services:
      main:
        enabled: false
    deployment:
      replicas: 2

  nightly-report:
    kind: CronJob
    cronjob:
      schedule: "0 3 * * *"
      timeZone: America/Chicago
    container:
      image:
        repository: ghcr.io/example/app
      command: [./report]
    serviceAccount:
      enabled: false

appResources:
  configMap:
    app-config:
      data:
        config.yml: |
          log_level: info
  externalSecret:
    api-key:
      data:
        api-key:
          remoteRef:
            key: example-api-key
  pvc:
    config:
rawResources:
  widget:
    manifest:
      apiVersion: example.io/v1
      kind: Widget
      spec:
        size: 3
