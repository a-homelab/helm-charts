name: Validate Common

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        helm: [v3.22.0, v4.3.0]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: ${{ matrix.helm }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.3 jsonschema==4.26.0
      - name: Resolve local library dependency
        run: |-
          helm dependency update charts/common-tests --skip-refresh
          mkdir -p charts/blender/charts
          helm package charts/common --destination charts/blender/charts
      - name: Check generated schemas
        run: |-
          python scripts/common_schema.py charts/common --check
          python scripts/common_schema.py charts/common-tests --check
          python scripts/common_schema.py charts/blender --extensions charts/blender/schema/extensions.json --check
      - name: Verify pinned output schema snapshots
        if: startsWith(matrix.helm, 'v3.')
        run: python scripts/update_common_schemas.py --cache '${{ runner.temp }}/common-schema-sources' --check
      - name: Lint
        run: |-
          helm lint charts/common --strict
          helm lint charts/common-tests --strict
          helm lint charts/blender --strict
      - name: Install helm-unittest
        if: startsWith(matrix.helm, 'v3.')
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.5.2
      - name: Run unit tests
        if: startsWith(matrix.helm, 'v3.')
        run: helm unittest charts/common-tests
      - name: Validate overlays, references, native outputs and migration examples
        run: python -m pytest scripts/test_common.py charts/blender/tests -q
      - name: Render harness fixtures
        run: |-
          helm template t charts/common-tests > /dev/null
          helm template t charts/common-tests -f charts/common-tests/ci/multi-component-values.yaml > /dev/null
          helm template t charts/common-tests -f charts/common-tests/ci/controllers-values.yaml > /dev/null

  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.31"
            image: kindest/node:v1.31.9@sha256:156da58ab617d0cb4f56bbdb4b493f4dc89725505347a4babde9e9544888bb92
            gateway: ""
          - kubernetes: "1.36"
            image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
            gateway: --gateway
          - kubernetes: "1.37"
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
            gateway: ""
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.22.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - name: Install pinned kind
        run: |-
          curl --fail --location --output kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind' | sha256sum --check
          chmod +x kind
      - name: Create disposable cluster
        run: ./kind create cluster --name common-validation --image '${{ matrix.image }}' --kubeconfig '${{ runner.temp }}/common-kubeconfig' --wait 120s
      - name: Verify admission and controller behavior
        run: python scripts/test_common_cluster.py --kubeconfig '${{ runner.temp }}/common-kubeconfig' --cache '${{ runner.temp }}/common-crds' ${{ matrix.gateway }}
      - name: Collect cluster diagnostics
        if: failure()
        run: ./kind export logs '${{ runner.temp }}/common-logs' --name common-validation
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: common-cluster-${{ matrix.kubernetes }}
          path: ${{ runner.temp }}/common-logs
      - name: Remove disposable cluster
        if: always()
        run: ./kind delete cluster --name common-validation
