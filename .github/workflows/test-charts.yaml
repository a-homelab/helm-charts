name: Test Charts

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/test-charts.yaml"
  push:
    branches:
      - main
      - feat/common-v2
    paths:
      - "charts/**"
      - ".github/workflows/test-charts.yaml"

env:
  PUBLIC_REGISTRY: registry.benfu.me/helm

jobs:
  test:
    name: Lint, unit tests, schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Resolve test harness dependency
        run: helm dependency update charts/common-tests

      - name: Lint
        run: |-
          helm lint charts/common --strict
          helm lint charts/common-tests --strict

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.5.2

      - name: Run unit tests
        run: helm unittest charts/common-tests

      - name: Render fixtures
        run: |-
          helm template t charts/common-tests > /dev/null
          helm template t charts/common-tests -f charts/common-tests/ci/multi-component-values.yaml > /dev/null
          helm template t charts/common-tests -f charts/common-tests/ci/controllers-values.yaml > /dev/null

      - name: Validate fixtures against values schema
        run: |-
          pipx run check-jsonschema \
            --schemafile charts/common/schema/values.schema.json \
            charts/common-tests/values.yaml \
            charts/common-tests/ci/multi-component-values.yaml \
            charts/common-tests/ci/controllers-values.yaml

  # Pre-release publishing from the feature branch so the alpha chart can be
  # consumed and tested before merge. Stable releases stay on main via
  # build-push-charts.yaml.
  publish-prerelease:
    name: Publish pre-release chart
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/common-v2'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Extract version
        id: extract-version
        run: |-
          echo "chart-version=$(yq '.version' charts/common/Chart.yaml)" >> "${GITHUB_OUTPUT}"

      - name: Require pre-release version
        run: |-
          version="${{ steps.extract-version.outputs.chart-version }}"
          if [[ "${version}" != *-* ]]; then
            echo "Refusing to publish non-pre-release version ${version} from a feature branch" >&2
            exit 1
          fi

      - name: Build chart
        run: |-
          mkdir -p dist/
          helm package charts/common --destination dist/

      - name: Login to the helm registry
        run: |-
          echo "${HELM_INTERNAL_REGISTRY_PASSWORD}" | helm registry login "${PUBLIC_REGISTRY}" --username "${HELM_INTERNAL_REGISTRY_USERNAME}" --password-stdin
        env:
          HELM_INTERNAL_REGISTRY_USERNAME: ${{ secrets.HELM_INTERNAL_REGISTRY_USERNAME }}
          HELM_INTERNAL_REGISTRY_PASSWORD: ${{ secrets.HELM_INTERNAL_REGISTRY_PASSWORD }}

      - name: Push chart
        run: |-
          helm push dist/common-${{ steps.extract-version.outputs.chart-version }}.tgz "oci://${PUBLIC_REGISTRY}"
